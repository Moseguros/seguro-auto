# Excepções do OSV-Scanner (.github/workflows/security.yml, S6-08 §6). Cada excepção tem justificação e
# data de revisão (ignoreUntil): passada a data, a vulnerabilidade volta a falhar o workflow.
#
# Formato:
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-02-01
# reason = "Porque não se aplica / quando se corrige (quem reviu)."
#
# 20/11/2026 — Decisão do agente (a validar no PR do S6-08; Q-ASVS-4 em docs/releases/R1.md): o que tem
# correcção dentro das linhas geridas pelo Spring Boot 3.3 foi actualizado (Tomcat 10.1.62, Netty
# 4.1.141.Final, PostgreSQL JDBC 42.7.14, Thymeleaf 3.1.7, amqp-client 5.34.0, Bouncy Castle 1.85.2,
# Guava 33.7.2, js-yaml 4.3.2). O resto só se corrige com o Spring Boot 3.5+ (fora do "3.3.x" do AGENTS.md)
# ou com versões maiores de ferramentas da web: fica aqui, com prazo de revisão, até essa actualização.
# Lista conferida com a API do OSV (api.osv.dev) a 20/11/2026: HIGH/CRITICAL com CVSS >= 7.0 ou com a
# classificação HIGH/CRITICAL do GitHub Advisory.

