# Servidor da web dentro do contentor (nginx-unprivileged, porta 8080).
server {
    listen 8080;
    # IPv6 também: dentro do contentor "localhost" resolve primeiro para ::1 (healthcheck do compose).
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança (S6-08 §6, ASVS V14.4). "always": também nos erros. O 'unsafe-inline' em
    # style-src é exigido pelo MUI/Emotion (estilos injectados em <style>); o Turnstile (S6-03) precisa de
    # challenges.cloudflare.com em script-src e frame-src. O HSTS fica no terminador TLS de staging/produção.
    # Atenção: um add_header dentro de um location anula estes; os locations que os têm repetem o include.
    include /etc/nginx/security-headers.inc;
    server_tokens off;

    # Métricas e API interna nunca saem para fora (S6-08 §1, §6): o backend também recusa /api/v1/prometheus
    # a endereços fora da rede interna, e /internal/** não é encaminhado.
    location = /api/v1/prometheus {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    # API: proxy para o backend do docker-compose.
    location /api/ {
        # Envios de ficheiros até 10 MB (S2-01; ADR-005) mais os outros campos do pedido. Sem isto
        # o nginx recusa (413) tudo acima de 1 MB.
        client_max_body_size 12m;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Substitui (não acrescenta) o X-Forwarded-For do cliente (S6-03 §5): o backend usa o primeiro
        # valor vindo de um proxy de confiança (MOSEGUROS_WEB_TRUSTED_PROXIES) como IP do cliente, nos
        # limites de pedidos, na auditoria e na assinatura das propostas.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O backend envia os mesmos cabeçalhos (Spring Security): ficam só os do nginx, sem repetidos.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # Ficheiros com hash no nome: cache longa.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca fica em cache, para apanhar a versão nova logo após um deploy.
    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: rotas do React Router servem o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
