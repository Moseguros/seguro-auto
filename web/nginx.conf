# Servidor da web dentro do contentor (nginx-unprivileged, porta 8080).
server {
    listen 8080;
    # IPv6 também: dentro do contentor "localhost" resolve primeiro para ::1 (healthcheck do compose).
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API: proxy para o backend do docker-compose.
    location /api/ {
        # Envios de ficheiros até 10 MB (S2-01; ADR-005) mais os outros campos do pedido. Sem isto
        # o nginx recusa (413) tudo acima de 1 MB.
        client_max_body_size 12m;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheiros com hash no nome: cache longa.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca fica em cache, para apanhar a versão nova logo após um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: rotas do React Router servem o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
