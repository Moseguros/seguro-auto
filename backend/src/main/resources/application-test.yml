# Testes: a base de dados vem do Testcontainers (TestcontainersConfiguration)
logging:
  level:
    mz.co.moseguros: DEBUG

moseguros:
  # Tarifação externa (S3-02): aceita http:// (WireMock) e um segredo de teste.
  rating:
    external:
      allow-http: true
    secrets:
      wiremock-test: segredo-de-teste-s3-02
  crypto:
    data-keys:
      1: nEcMdPbB/qV7ADNuz/GQcpMnu1sMcDyT3vcivU34TEQ= # chave só para desenvolvimento
    blind-index-key: D41q5YP5RK464nQaKvEc7FkNnoZGgydbxcv0pcPbr+0= # chave só para desenvolvimento
  security:
    otp:
      pepper: test-otp-pepper-only-for-tests
    # Cliente de serviço do payment-file-worker (S5-09).
    service-clients:
      payment-file-worker:
        secret: test-worker-secret-only-for-tests-0001
  # Os testes de integração usam canais falsos (FakeOtpDeliveryChannels, perfil test).
  notification:
    webhook-secret: test-webhook-secret
    sms:
      provider: fake
    whatsapp:
      provider: fake
    email:
      provider: fake
  # Cofre em memória (InMemorySecretStore); o VaultSecretStoreIT usa um Vault real (Testcontainers).
  secrets:
    store: in-memory
  files:
    storage: filesystem
    filesystem:
      base-dir: ${java.io.tmpdir}/moseguros-test-files
  # Sem @Scheduled nos testes: chamam o job directamente.
  jobs:
    enabled: false
