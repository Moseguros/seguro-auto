# Testes: a base de dados vem do Testcontainers (TestcontainersConfiguration)
logging:
  level:
    mz.co.moseguros: DEBUG

moseguros:
  crypto:
    data-keys:
      1: nEcMdPbB/qV7ADNuz/GQcpMnu1sMcDyT3vcivU34TEQ= # chave só para desenvolvimento
    blind-index-key: D41q5YP5RK464nQaKvEc7FkNnoZGgydbxcv0pcPbr+0= # chave só para desenvolvimento
  security:
    otp:
      pepper: test-otp-pepper-only-for-tests
  # Os testes de integração usam canais falsos (FakeOtpDeliveryChannels, perfil test).
  notification:
    webhook-secret: test-webhook-secret
    sms:
      provider: fake
    whatsapp:
      provider: fake
    email:
      provider: fake
  files:
    storage: filesystem
    filesystem:
      base-dir: ${java.io.tmpdir}/moseguros-test-files
  # Sem @Scheduled nos testes: chamam o job directamente.
  jobs:
    enabled: false
