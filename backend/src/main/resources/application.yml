spring:
  application:
    name: moseguros-backend
  # A aplicação liga-se com um utilizador sem privilégios de dono (o RLS aplica-se a ele);
  # o Flyway usa o dono das tabelas (ADR-002, adenda de 01/11/2026).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moseguros}
    username: ${DB_USERNAME:moseguros_app_user}
    password: ${DB_PASSWORD:moseguros_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    user: ${DB_OWNER_USERNAME:moseguros}
    password: ${DB_OWNER_PASSWORD:moseguros}
    # A migração V202610311200 cria os schemas; o histórico do Flyway fica em public.
    default-schema: public
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  # Documento estável (comparado com api/openapi.yaml pelo scripts/check-openapi.sh)
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  # As respostas de erro vêm do OpenApiConfig (ProblemDetail em 4XX/5XX), não do
  # GlobalExceptionHandler.
  override-with-generic-response: false
  swagger-ui:
    enabled: true

moseguros:
  # Cifra de colunas (AES-256-GCM): versão → chave de 32 bytes em Base64. Sem chave a
  # aplicação não arranca. Em staging/produção vem de MOSEGUROS_DATA_KEY_1 (cofre de
  # segredos no Sprint 5).
  crypto:
    current-key-version: 1
    data-keys:
      1: ${MOSEGUROS_DATA_KEY_1:}
  plates:
    # Formatos de matrícula aceites, testados por ordem. O pattern aplica-se ao valor
    # normalizado (maiúsculas, sem espaços nem hífens); o display-template usa {grupo}.
    formats:
      - code: STANDARD
        label: Actual (ABC-123-MC)
        pattern: '^(?<l>[A-Z]{3})(?<n>\d{3})(?<p>[A-Z]{2})$'
        display-template: '{l}-{n}-{p}'
      - code: LEGACY
        label: Antigo (ABC-12-34)
        pattern: '^(?<l>[A-Z]{3})(?<a>\d{2})(?<b>\d{2})$'
        display-template: '{l}-{a}-{b}'
