spring:
  application:
    name: moseguros-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moseguros}
    username: ${DB_USERNAME:moseguros}
    password: ${DB_PASSWORD:moseguros}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # A migração V202610311200 cria os schemas; o histórico do Flyway fica em public.
    default-schema: public
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true

moseguros:
  plates:
    # Formatos de matrícula aceites, testados por ordem. O pattern aplica-se ao valor
    # normalizado (maiúsculas, sem espaços nem hífens); o display-template usa {grupo}.
    formats:
      - code: STANDARD
        label: Actual (ABC-123-MC)
        pattern: '^(?<l>[A-Z]{3})(?<n>\d{3})(?<p>[A-Z]{2})$'
        display-template: '{l}-{n}-{p}'
      - code: LEGACY
        label: Antigo (ABC-12-34)
        pattern: '^(?<l>[A-Z]{3})(?<a>\d{2})(?<b>\d{2})$'
        display-template: '{l}-{a}-{b}'
