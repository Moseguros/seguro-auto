# Messages sent by the backend (SMS, WhatsApp, e-mail). UTF-8. {0} = code, {1} = minutes.
# WhatsApp uses the approved template moseguros_otp with the parameter code (not these texts).
otp.sms=MoSeguros: your code is {0}. Valid for {1} min. Do not share it with anyone.
otp.email.subject=Your MoSeguros code
otp.email.body=Hello,\n\nyour MoSeguros access code is {0}. It is valid for {1} minutes.\n\nIf you did not request this code, please ignore this message.

# Staff invitation (S1-04). {0} = name, {1} = invitation.email.organization or empty (platform), {2} = link.
invitation.email.subject=Invitation to MoSeguros
invitation.email.body=Hello {0},\n\nYou have been invited to use MoSeguros{1}. To activate your account, open the link below within the next 7 days:\n\n{2}\n\nYou will need an authenticator app on your phone (for example, Google Authenticator or Microsoft Authenticator).\n\nIf you were not expecting this invitation, please ignore this message.
# {0} = organization name
invitation.email.organization=\ as a member of {0}

# Staff password reset (S1-05). {0} = name, {1} = link.
password-reset.email.subject=Reset your MoSeguros password
password-reset.email.body=Hello {0},\n\nWe received a request to set a new password. Open the link below within the next 30 minutes:\n\n{1}\n\nIf you did not make this request, ignore this message; your password does not change.

# Identity check result (S4-01). {0} = first name, {1} = kyc.reason.<CODE>,
# {2} = {web.base-url}/cliente/identidade. kyc.reason.OTHER: {0} = reason written by the underwriter.
kyc.verified.email.subject=Your identity has been verified
kyc.verified.email.body=Hello {0},\n\nyour MoSeguros identity check is complete.\n\nThe MoSeguros team
kyc.rejected.email.subject=We could not verify your identity
kyc.rejected.email.body=Hello {0},\n\nwe could not verify your identity: {1}\n\nYou can send new photos in the MoSeguros app or at {2}.\n\nThe MoSeguros team
kyc.reason.DOCUMENT_UNREADABLE=the document photos are not readable.
kyc.reason.DOCUMENT_EXPIRED=the document has expired.
kyc.reason.DATA_MISMATCH=the document details do not match your profile.
kyc.reason.SELFIE_MISMATCH=the selfie does not confirm that you are the document holder.
kyc.reason.OTHER={0}

# Proposal signing code (S4-04). Provisional texts, pending legal review.
# {0} = code, {1} = proposal number, {2} = insurer, {3} = total (as in the PDF), {4} = minutes,
# {5} = broker name (assisted signing only, S4-06). WhatsApp uses the template moseguros_sign_otp with
# the parameters code, ref, insurer and total (not these texts).
otp.sign.sms=MoSeguros: code {0} signs proposal {1} from {2}, premium {3}. Valid {4} min. Do not share it with anyone.
otp.sign-assisted.sms=MoSeguros: code {0} signs proposal {1} from {2}, premium {3}, prepared by {5}. Valid {4} min. Only tell it to {5} if you agree with the proposal. MoSeguros never asks for codes by phone.
otp.sign.email.subject=Code to sign proposal {1}
otp.sign.email.body=Hello,\n\ncode {0} signs proposal {1} from {2}, with a total premium of {3}. It is valid for {4} minutes.\n\nIf you did not request this code, ignore this message.
otp.sign-assisted.email.subject=Code to sign proposal {1}
otp.sign-assisted.email.body=Hello,\n\ncode {0} signs proposal {1} from {2}, with a total premium of {3}, prepared by {5}. It is valid for {4} minutes.\n\nOnly tell it to {5} if you agree with the proposal. MoSeguros never asks for codes by phone.\n\nIf you did not request this code, ignore this message.

# Proposal (S4-05 §9). Provisional texts. Customer: {0} = number, {1} = insurer, {2} = first name,
# {3} = insurer deadline (date) / total / rejection reason / underwriter message,
# {4} = {web.base-url}/cliente/propostas/{id}, {5} = customer deadline (expires_at, date in Maputo).
proposal.submitted.email.subject=Proposal {0} sent to {1}
proposal.submitted.email.body=Hello {2},\n\nyour proposal {0} has been sent to {1}, which has until {3} to reply.\n\nYou can follow it in the MoSeguros app or at {4}.\n\nThe MoSeguros team
proposal.accepted.email.subject=Proposal {0} accepted
proposal.accepted.email.body=Hello {2},\n\n{1} has accepted your proposal {0}. Total premium: {3}.\n\nNext step: pay the premium by {5}, in the MoSeguros app or at {4}.\n\nThe MoSeguros team
proposal.rejected.email.subject=Proposal {0} not accepted
proposal.rejected.email.body=Hello {2},\n\n{1} has not accepted your proposal {0}.\nReason: {3}\n\nYou can request new quotes in the MoSeguros app or at {4}.\n\nThe MoSeguros team
proposal.info-requested.email.subject={1} needs more information (proposal {0})
proposal.info-requested.email.body=Hello {2},\n\nto review proposal {0}, {1} asks for the following:\n{3}\n\nPlease reply by {5} in the MoSeguros app or at {4}.\n\nThe MoSeguros team
# SLA alert to underwriters: {0} = number, {1} = decision-alert-days, {2} = underwriter name,
# {3} = review_started_at, {4} = sla_due_at (date and time in Maputo), {5} = {web.base-url}/seguradora/propostas/{id}.
proposal.sla-alert.email.subject=Proposal {0} has been awaiting a decision for {1} days
proposal.sla-alert.email.body=Hello {2},\n\nproposal {0} was submitted on {3} and has no decision yet. The deadline is {4}.\n\n{5}\n\nMoSeguros
# Proposal prepared by an intermediary (S4-06 §8): {0} = number, {1} = intermediary, {2} = customer first
# name (or "customer"), {3} = insurer, {4} = total, {5} = {web.base-url}/cliente/propostas/{id}.
proposal.created-by-broker.email.subject={1} has prepared an insurance proposal for you
proposal.created-by-broker.email.body=Hello {2},\n\n{1} has prepared proposal {0} from {3}, with a total premium of {4}.\n\nYou can view, complete and sign it in the MoSeguros app or at {5}. If you do not know this intermediary, do not sign it and contact us.\n\nThe MoSeguros team

# Payments (S5-02 §11). The money goes directly to the insurer.
# Reference by SMS: {0} = exact amount, {1} = entity, {2} = reference in groups of 3 digits,
# {3} = valid until (dd/MM HH:mm, Maputo), {4} = insurer.
payment.reference.sms=MoSeguros: pay {0} at entity {1}, reference {2}, by {3}. Payment goes to {4}.
# Payment link sent by the intermediary: {0} = proposal, {1} = insurer, {2} = amount, {3} = link.
proposal.payment-link.sms=MoSeguros: your proposal {0} with {1} is ready to pay ({2}). Pay here: {3}
# Payment received (S5-02 §9.1). SMS to a customer without a verified e-mail: {0} = amount, {1} = proposal,
# {2} = insurer.
proposal.paid.sms=MoSeguros: we received the payment of {0} for proposal {1} ({2}). Your policy will be issued shortly.
# To the customer: {0} = name, {1} = amount, {2} = proposal, {3} = insurer, {4} = method.
proposal.paid.email.subject=Payment received — proposal {0}
proposal.paid.email.body=Hello {0},\n\nwe received the payment of {1} for proposal {2}, made to {3} by {4}. Your policy will be issued automatically and sent to you.\n\nThank you for using MoSeguros.
# To the intermediary: {0} = proposal, {1} = customer, {2} = amount, {3} = method, {4} = insurer.
proposal.paid.broker.email.subject=Payment received — proposal {0}
proposal.paid.broker.email.body=Proposal {0} of customer {1} was paid ({2}, by {3}) to {4}. The policy will be issued automatically.
# To the insurer: {0} = proposal, {1} = payment PG-…, {2} = amount, {3} = customer, {4} = method,
# {5} = {web.base-url}/seguradora/pagamentos/{intentId}.
proposal.paid.insurer.email.subject=Payment received — proposal {0}
proposal.paid.insurer.email.body=We received payment {1} of {2} for proposal {0} (customer {3}), by {4}. The policy will be issued automatically. Details: {5}
# Method names in messages.
payment.method.MPESA=M-Pesa
payment.method.BANK_REFERENCE=Entity and reference
