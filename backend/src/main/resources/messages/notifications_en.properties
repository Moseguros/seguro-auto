notify.PROPOSAL_ACCEPTED.whatsapp.params=proposalNumber,insurerName,amount
notify.PROPOSAL_ACCEPTED.whatsapp.body=MoSeguros: proposal {{proposalNumber}} was accepted by {{insurerName}}. Pay {{amount}} in the app or at {{siteUrl}}.
notify.PROPOSAL_ACCEPTED.email.subject=Your proposal was accepted
