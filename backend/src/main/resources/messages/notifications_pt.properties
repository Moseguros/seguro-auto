# Mensagens enviadas pelo backend (SMS, WhatsApp, e-mail). UTF-8. {0} = código, {1} = minutos.
# O WhatsApp usa o modelo aprovado moseguros_otp com o parâmetro code (não usa estes textos).
otp.sms=MoSeguros: o seu código é {0}. Válido por {1} min. Não o partilhe com ninguém.
otp.email.subject=O seu código MoSeguros
otp.email.body=Olá,\n\no seu código de acesso à MoSeguros é {0}. É válido durante {1} minutos.\n\nSe não pediu este código, ignore esta mensagem.

# Convite de staff (S1-04). {0} = nome, {1} = invitation.email.organization ou vazio (plataforma), {2} = link.
invitation.email.subject=Convite para a MoSeguros
invitation.email.body=Olá {0},\n\nFoi convidado para usar a MoSeguros{1}. Para activar a sua conta, abra o link abaixo nos próximos 7 dias:\n\n{2}\n\nVai precisar de uma aplicação de autenticação no telemóvel (por exemplo, Google Authenticator ou Microsoft Authenticator).\n\nSe não esperava este convite, ignore esta mensagem.
# {0} = nome da organização
invitation.email.organization=\ como membro de {0}

# Recuperação de palavra-passe de staff (S1-05). {0} = nome, {1} = link.
password-reset.email.subject=Recuperar a palavra-passe da MoSeguros
password-reset.email.body=Olá {0},\n\nRecebemos um pedido para definir uma nova palavra-passe. Abra o link abaixo nos próximos 30 minutos:\n\n{1}\n\nSe não fez este pedido, ignore esta mensagem; a sua palavra-passe não muda.

# Resultado da verificação de identidade (S4-01). {0} = primeiro nome, {1} = kyc.reason.<CODE>,
# {2} = {web.base-url}/cliente/identidade. kyc.reason.OTHER: {0} = motivo escrito pelo subscritor.
kyc.verified.email.subject=A sua identidade foi verificada
kyc.verified.email.body=Olá {0},\n\na verificação da sua identidade na MoSeguros foi concluída.\n\nEquipa MoSeguros
kyc.rejected.email.subject=Não foi possível verificar a sua identidade
kyc.rejected.email.body=Olá {0},\n\nnão conseguimos verificar a sua identidade: {1}\n\nPode enviar novas fotografias na aplicação MoSeguros ou em {2}.\n\nEquipa MoSeguros
kyc.reason.DOCUMENT_UNREADABLE=as fotografias do documento não estão legíveis.
kyc.reason.DOCUMENT_EXPIRED=o documento está fora da validade.
kyc.reason.DATA_MISMATCH=os dados do documento não coincidem com os do seu perfil.
kyc.reason.SELFIE_MISMATCH=a selfie não permite confirmar que é o titular do documento.
kyc.reason.OTHER={0}

# Código de assinatura da proposta (S4-04). Textos provisórios, a validar juridicamente.
# {0} = código, {1} = número da proposta, {2} = seguradora, {3} = total (como no PDF), {4} = minutos,
# {5} = nome do mediador (só nas assistidas, S4-06). O WhatsApp usa o modelo moseguros_sign_otp com os
# parâmetros code, ref, insurer e total (não usa estes textos).
otp.sign.sms=MoSeguros: o código {0} assina a proposta {1} da {2}, prémio {3}. Válido {4} min. Não o partilhe com ninguém.
otp.sign-assisted.sms=MoSeguros: o código {0} assina a proposta {1} da {2}, prémio {3}, preparada por {5}. Válido {4} min. Diga-o só a {5}, se concordar com a proposta. A MoSeguros nunca lhe pede códigos por telefone.
otp.sign.email.subject=Código para assinar a proposta {1}
otp.sign.email.body=Olá,\n\no código {0} assina a proposta {1} da {2}, com o prémio total de {3}. É válido durante {4} minutos.\n\nSe não pediu este código, ignore esta mensagem.
otp.sign-assisted.email.subject=Código para assinar a proposta {1}
otp.sign-assisted.email.body=Olá,\n\no código {0} assina a proposta {1} da {2}, com o prémio total de {3}, preparada por {5}. É válido durante {4} minutos.\n\nDiga-o só a {5}, se concordar com a proposta. A MoSeguros nunca lhe pede códigos por telefone.\n\nSe não pediu este código, ignore esta mensagem.

# Proposta (S4-05 §9). Textos provisórios. Cliente: {0} = número, {1} = seguradora, {2} = primeiro nome,
# {3} = prazo da seguradora (data) / total / motivo da recusa / mensagem do subscritor,
# {4} = {web.base-url}/cliente/propostas/{id}, {5} = prazo do cliente (expires_at, data em Maputo).
proposal.submitted.email.subject=Proposta {0} enviada à {1}
proposal.submitted.email.body=Olá {2},\n\na sua proposta {0} foi enviada à {1}, que tem até {3} para responder.\n\nPode acompanhá-la na aplicação MoSeguros ou em {4}.\n\nEquipa MoSeguros
# Alerta de SLA aos subscritores: {0} = número, {1} = decision-alert-days, {2} = nome do subscritor,
# {3} = review_started_at, {4} = sla_due_at (data e hora em Maputo), {5} = {web.base-url}/seguradora/propostas/{id}.
proposal.sla-alert.email.subject=Proposta {0} aguarda decisão há {1} dias
proposal.sla-alert.email.body=Olá {2},\n\na proposta {0} foi submetida em {3} e ainda não tem decisão. O prazo termina em {4}.\n\n{5}\n\nMoSeguros
# Proposta preparada por um mediador (S4-06 §8): {0} = número, {1} = mediador, {2} = primeiro nome do
# cliente (ou "cliente"), {3} = seguradora, {4} = total, {5} = {web.base-url}/cliente/propostas/{id}.
proposal.created-by-broker.email.subject={1} preparou uma proposta de seguro para si
proposal.created-by-broker.email.body=Olá {2},\n\n{1} preparou a proposta {0} da {3}, com o prémio total de {4}.\n\nPode vê-la, completá-la e assiná-la na aplicação MoSeguros ou em {5}. Se não conhece este mediador, não assine e contacte-nos.\n\nEquipa MoSeguros

# Pagamentos (S5-02 §11). O dinheiro vai directamente para a seguradora.
# Referência por SMS: {0} = montante exacto, {1} = entidade, {2} = referência em grupos de 3 dígitos,
# {3} = válida até (dd/MM HH:mm, Maputo), {4} = seguradora.
payment.reference.sms=MoSeguros: pague {0} na entidade {1}, referência {2}, até {3}. O pagamento é feito à {4}.
# Link de pagamento enviado pelo mediador: {0} = proposta, {1} = seguradora, {2} = montante,
# {3} = {web.base-url}/cliente/propostas/{id}/pagar?origem=mediador.
proposal.payment-link.sms=MoSeguros: a sua proposta {0} da {1} está pronta a pagar ({2}). Pague aqui: {3}
# Pagamento recebido (S5-02 §9.1). SMS ao cliente sem e-mail verificado: {0} = montante, {1} = proposta,
# {2} = seguradora.
proposal.paid.sms=MoSeguros: recebemos o pagamento de {0} da proposta {1} ({2}). A apólice vai ser emitida em breve.
# Ao cliente (assunto e corpo com os mesmos argumentos): {0} = nome, {1} = montante, {2} = proposta,
# {3} = seguradora, {4} = método.
proposal.paid.email.subject=Pagamento recebido — proposta {2}
proposal.paid.email.body=Olá {0},\n\nrecebemos o pagamento de {1} da proposta {2}, feito à {3} por {4}. A sua apólice vai ser emitida automaticamente e enviada para si.\n\nObrigado por usar a MoSeguros.
# Ao mediador: {0} = proposta, {1} = cliente, {2} = montante, {3} = método, {4} = seguradora.
proposal.paid.broker.email.subject=Pagamento recebido — proposta {0}
proposal.paid.broker.email.body=A proposta {0} do cliente {1} foi paga ({2}, por {3}) à {4}. A apólice vai ser emitida automaticamente.
# À seguradora: {0} = proposta, {1} = pagamento PG-…, {2} = montante, {3} = cliente, {4} = método,
# {5} = {web.base-url}/seguradora/pagamentos/{intentId}.
proposal.paid.insurer.email.subject=Pagamento recebido — proposta {0}
proposal.paid.insurer.email.body=Recebemos o pagamento {1} de {2} da proposta {0} (cliente {3}), por {4}. A apólice vai ser emitida automaticamente. Detalhe: {5}
# Nome dos métodos nas mensagens.
payment.method.MPESA=M-Pesa
payment.method.BANK_REFERENCE=Entidade e referência

