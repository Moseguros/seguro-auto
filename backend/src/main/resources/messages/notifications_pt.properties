# Mensagens enviadas pelo backend (SMS, WhatsApp, e-mail). UTF-8. {0} = código, {1} = minutos.
# O WhatsApp usa o modelo aprovado moseguros_otp com o parâmetro code (não usa estes textos).
otp.sms=MoSeguros: o seu código é {0}. Válido por {1} min. Não o partilhe com ninguém.
otp.email.subject=O seu código MoSeguros
otp.email.body=Olá,\n\no seu código de acesso à MoSeguros é {0}. É válido durante {1} minutos.\n\nSe não pediu este código, ignore esta mensagem.

# Convite de staff (S1-04). {0} = nome, {1} = invitation.email.organization ou vazio (plataforma), {2} = link.
invitation.email.subject=Convite para a MoSeguros
invitation.email.body=Olá {0},\n\nFoi convidado para usar a MoSeguros{1}. Para activar a sua conta, abra o link abaixo nos próximos 7 dias:\n\n{2}\n\nVai precisar de uma aplicação de autenticação no telemóvel (por exemplo, Google Authenticator ou Microsoft Authenticator).\n\nSe não esperava este convite, ignore esta mensagem.
# {0} = nome da organização
invitation.email.organization=\ como membro de {0}

# Recuperação de palavra-passe de staff (S1-05). {0} = nome, {1} = link.
password-reset.email.subject=Recuperar a palavra-passe da MoSeguros
password-reset.email.body=Olá {0},\n\nRecebemos um pedido para definir uma nova palavra-passe. Abra o link abaixo nos próximos 30 minutos:\n\n{1}\n\nSe não fez este pedido, ignore esta mensagem; a sua palavra-passe não muda.
