name: backend

# Reactor Maven na raiz (S5-06, decisão D18): o backend e o payment-file-worker (S5-09) usam o
# payment-contracts sem o publicar.
on:
  pull_request:
    paths:
      - "backend/**"
      - "payment-contracts/**"
      - "payment-file-worker/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "infra/mocks/mpesa-mock/**" # MpesaMockKeyConsistencyTest e testes do adaptador M-Pesa (S5-04)
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "payment-contracts/**"
      - "payment-file-worker/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "infra/mocks/mpesa-mock/**" # MpesaMockKeyConsistencyTest e testes do adaptador M-Pesa (S5-04)
      - ".github/workflows/backend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  payment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build e testes dos contratos
        run: ./mvnw -B -pl payment-contracts verify

      - name: Relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-contracts-test-reports
          path: payment-contracts/target/surefire-reports/
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Na raiz, com -am (constrói o payment-contracts no reactor). Testcontainers usa o Docker do runner.
      - name: Build e testes
        run: ./mvnw -B -pl backend -am verify

      - name: Relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  # Worker dos ficheiros de pagamento (S5-09): Testcontainers (Postgres, RabbitMQ, atmoz/sftp, Vault).
  payment-file-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build e testes
        run: ./mvnw -B -pl payment-file-worker -am verify

      - name: Relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-file-worker-test-reports
          path: |
            payment-file-worker/target/surefire-reports/
            payment-file-worker/target/failsafe-reports/
          if-no-files-found: ignore
