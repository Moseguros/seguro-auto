name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - "backend/**"
      - "payment-contracts/**"
      - "payment-file-worker/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".dockerignore"
      - "web/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backend/**"
      - "payment-contracts/**"
      - "payment-file-worker/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".dockerignore"
      - "web/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: infra/docker-compose.yml

jobs:
  mpesa-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/mocks/mpesa-mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testes do simulador M-Pesa
        run: ./mvnw -B verify

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar o compose
        run: docker compose config --quiet

      - name: Subir
        run: docker compose up -d --build

      - name: Esperar que todos os serviços fiquem saudáveis (máx. 3 min)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Versão (backend directo e pela web)
        run: |
          curl -fsS http://localhost:8080/api/v1/meta/version
          echo
          curl -fsS http://localhost:3000/api/v1/meta/version
          echo

      # O backend declara a topologia dos pagamentos no arranque (S5-06).
      - name: Filas do RabbitMQ
        run: |
          queues=$(curl -fsS -u moseguros:moseguros http://localhost:15672/api/queues | grep -o '"name":"core[^"]*"' | sort)
          echo "$queues"
          for q in core.reference-payments core.payment-file-events core.reference-payments.dlq core.payment-file-events.dlq; do
            echo "$queues" | grep -q "\"name\":\"$q\"" || { echo "falta a fila $q"; exit 1; }
          done

      # O worker obtém o token de serviço e lê as fontes do backend (S5-09).
      - name: Worker de ficheiros de pagamento
        run: |
          curl -fsS http://localhost:8081/actuator/health
          echo
          docker compose logs --no-color payment-file-worker | grep -q "Source .* scheduled" || { echo "o worker não agendou as fontes de demonstração"; exit 1; }

      - name: Estado e registos
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Descer
        if: always()
        run: docker compose down -v
