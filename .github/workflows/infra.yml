name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - "backend/**"
      - "web/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "backend/**"
      - "web/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: infra/docker-compose.yml

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar o compose
        run: docker compose config --quiet

      - name: Subir
        run: docker compose up -d --build

      - name: Esperar que todos os serviços fiquem saudáveis (máx. 3 min)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Versão (backend directo e pela web)
        run: |
          curl -fsS http://localhost:8080/api/v1/meta/version
          echo
          curl -fsS http://localhost:3000/api/v1/meta/version
          echo

      - name: Estado e registos
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Descer
        if: always()
        run: docker compose down -v
