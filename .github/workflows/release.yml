name: release

# Imagens da release (S6-08 §7, decisão D20): em cada tag v* (v1.0.0-rc.1, v1.0.0…) constrói e publica
# ghcr.io/moseguros/{backend,payment-file-worker,web} com as tags <tag> e sha-<curto>, proveniência e SBOM.
# As tags são criadas pelo tech lead, nunca por um agente. Os mocks não são publicados.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: payment-file-worker
            context: .
            dockerfile: payment-file-worker/Dockerfile
          - image: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Nome e tags
        id: meta
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_REF_NAME}"
          short="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          name="ghcr.io/${owner}/${{ matrix.image }}"
          {
            echo "tags=${name}:${tag},${name}:sha-${short}"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3.7.1

      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6.9.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
