name: moseguros
description: "App MoSeguros para clientes finais (Android e iOS)."
publish_to: 'none'

version: 0.1.0+1

environment:
  # Versão do Flutter fixada (o CI lê-a daqui). Actualizar é uma tarefa própria.
  sdk: ^3.10.7
  flutter: 3.38.6

dependencies:
  built_collection: ^5.1.1
  built_value: ^8.13.0
  camera: ^0.12.0+2
  dio: ^5.11.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  moseguros_api:
    path: packages/moseguros_api
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  image: ^4.12.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/

# Ícone provisório (docs/brand/logo-mark.svg exportado para PNG). Regenerar com:
#   dart run flutter_launcher_icons
# e reverter a alteração que a 0.14.x faz no ios/Runner.xcodeproj/project.pbxproj
# (troca ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = YES por AppIcon).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  background_color_ios: "#142D4E"
  adaptive_icon_background: "#142D4E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
