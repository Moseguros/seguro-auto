# Fonte de dados do Grafana (S6-08 §3): o Prometheus do compose, com uid fixo (os painéis usam-no).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: moseguros-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
