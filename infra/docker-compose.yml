# Ambiente local da MoSeguros. Ver infra/README.md.
# Imagens com versão fixada e listadas em scripts/images.txt (actualizar no mesmo PR).
# Credenciais do .env (cópia do .env.example); os valores por defeito permitem correr sem .env.

name: moseguros

x-healthcheck: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 12

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moseguros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moseguros}
      POSTGRES_DB: ${POSTGRES_DB:-moseguros}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Papéis da aplicação (ADR-002); só corre com o volume vazio (ver README).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *healthcheck-timing
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interface web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      <<: *healthcheck-timing
    restart: unless-stopped

  sms-mock:
    build: mocks/sms-mock
    image: moseguros/sms-mock:local
    environment:
      # Recibos de entrega (2 s depois de cada envio) para o backend, com o mesmo segredo.
      RECEIPT_CALLBACK_URL: http://backend:8080/api/v1/integrations/delivery-receipts
      RECEIPT_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health"]
      <<: *healthcheck-timing
    restart: unless-stopped

  # Mensageria (S5-06, ADR-004): consola em http://localhost:15672 (RABBITMQ_DEFAULT_USER/PASS).
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-moseguros}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-moseguros}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # consola de gestão
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      <<: *healthcheck-timing
    restart: unless-stopped

  # SFTP onde o "banco" deposita os ficheiros MEPS/BMEPS (S5-06; lido pelo payment-file-worker, S5-09).
  # Utilizadores da Seguradora Demo (demo, MEPS) e da Seguradora Demo B (demob, BMEPS), S5-01 §8.
  # Só amd64 (em arm64 corre por emulação); a etiqueta "alpine" fixa-se pelo digest. Ver mocks/sftp/README.md.
  sftp:
    image: atmoz/sftp:alpine@sha256:43dd1c023cf1bae487127d4b54660b0aee6e94c188a6599be36fb89ba115f961
    command: demo:demo-sftp-pass:1001::inbound,processed,error demob:demob-sftp-pass:1002::inbound,processed,error
    ports:
      - "2222:22"
    volumes:
      - sftpdata:/home/demo
      - sftpdatab:/home/demob
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null"]
      <<: *healthcheck-timing
    restart: unless-stopped

  # Cofre de segredos (S5-01, modelo transversal §7) em modo dev: em memória, perde tudo ao reiniciar
  # (o DevPaymentSecretsSeeder do backend volta a escrever os segredos de desenvolvimento).
  vault:
    image: hashicorp/vault:1.20.4
    command: server -dev -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN:-dev-root-token} -dev-listen-address=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      <<: *healthcheck-timing
    restart: unless-stopped

  backend:
    # Contexto na raiz do repositório (reactor Maven: payment-contracts + backend, S5-06).
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: moseguros/backend:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-moseguros}
      # A aplicação liga-se sem privilégios de dono (o RLS aplica-se a ela); o Flyway usa o dono.
      DB_USERNAME: moseguros_app_user
      DB_PASSWORD: moseguros_app
      DB_OWNER_USERNAME: ${POSTGRES_USER:-moseguros}
      DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD:-moseguros}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      # Canais de envio do OTP (S1-03): simuladores de SMS e WhatsApp; e-mail no Mailpit.
      MOSEGUROS_NOTIFICATION_SMS_MOCK_URL: http://sms-mock:8090
      MOSEGUROS_NOTIFICATION_WHATSAPP_MOCK_URL: http://sms-mock:8090
      MOSEGUROS_NOTIFICATION_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret}
      # Convites de staff (S1-04): links para a web do compose e convite do primeiro
      # administrador da plataforma (o e-mail aparece no Mailpit, http://localhost:8025).
      MOSEGUROS_WEB_BASE_URL: http://localhost:3000
      MOSEGUROS_BOOTSTRAP_PLATFORM_ADMIN_EMAIL: admin@moseguros.local
      # Ficheiros enviados (S2-01): disco, no volume "files" (apagado com "docker compose down -v").
      MOSEGUROS_FILES_DIR: /var/lib/moseguros/files
      # RabbitMQ (S5-06): o backend declara a topologia dos pagamentos no arranque.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-moseguros}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-moseguros}
      # Cofre de segredos (S5-01): Vault do compose em modo dev, com o token de raiz.
      MOSEGUROS_SECRETS_STORE: vault
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
      # Cliente de serviço do payment-file-worker (S5-09): o mesmo segredo nos dois lados.
      MOSEGUROS_SERVICE_CLIENT_PAYMENT_FILE_WORKER_SECRET: ${SERVICE_CLIENT_PAYMENT_FILE_WORKER_SECRET:-local-worker-secret}
      JAVA_OPTS: -XX:MaxRAMPercentage=75
    ports:
      - "8080:8080"
    volumes:
      - files:/var/lib/moseguros/files
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    # Healthcheck: o HEALTHCHECK do backend/Dockerfile (GET /api/v1/health).
    restart: unless-stopped

  # Worker dos ficheiros de pagamento (S5-09): pede as fontes ao backend (token de serviço), lê o SFTP de
  # cada seguradora de minuto a minuto e publica os pagamentos no RabbitMQ. Actuator em http://localhost:8081.
  payment-file-worker:
    build:
      context: ..
      dockerfile: payment-file-worker/Dockerfile
    image: moseguros/payment-file-worker:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-moseguros}
      # Sem privilégios de dono (schema payment_worker); o Flyway do worker usa o dono.
      DB_USERNAME: moseguros_worker_user
      DB_PASSWORD: moseguros_worker
      DB_OWNER_USERNAME: ${POSTGRES_USER:-moseguros}
      DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD:-moseguros}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-moseguros}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-moseguros}
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
      WORKER_BACKEND_BASE_URL: http://backend:8080
      WORKER_CLIENT_SECRET: ${SERVICE_CLIENT_PAYMENT_FILE_WORKER_SECRET:-local-worker-secret}
      JAVA_OPTS: -XX:MaxRAMPercentage=75
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
      sftp:
        condition: service_healthy
    # Healthcheck: o HEALTHCHECK do payment-file-worker/Dockerfile (GET /actuator/health).
    restart: unless-stopped

  web:
    build: ../web
    image: moseguros/web:local
    ports:
      - "3000:8080" # nginx sem root escuta na 8080 dentro do contentor
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/"]
      <<: *healthcheck-timing
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  files:
  rabbitdata:
  sftpdata:
  sftpdatab:
