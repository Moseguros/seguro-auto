# RabbitMQ 4.1 do compose (S5-06, D19; S6-08 §2). Montado em /etc/rabbitmq/conf.d/20-moseguros.conf (os
# ficheiros de conf.d juntam-se à configuração da imagem, que continua a escutar em 5672/15672).
#
# Métricas Prometheus em http://rabbitmq:15692/metrics. Com return_per_object_metrics o /metrics devolve as
# métricas por fila (rabbitmq_queue_messages{vhost, queue}), usadas pelo alerta RabbitMqDeadLetters e pelo
# painel "Mensageria e pagamentos". Com muitas filas (staging) a alternativa é /metrics/detailed com
# family=queue_coarse_metrics; o backend publica também moseguros_payment_queue_messages{queue}.
prometheus.return_per_object_metrics = true
