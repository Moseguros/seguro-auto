<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMS mock - MoSeguros</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #E8EFF6; color: #142D4E; }
    header { background: #142D4E; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    h1 { font-size: 18px; margin: 0; }
    button { background: transparent; color: #fff; border: 1px solid #fff; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    main { padding: 16px; max-width: 960px; margin: 0 auto; }
    .empty { color: #4a5f7a; }
    article { background: #fff; border-radius: 6px; padding: 12px; margin-bottom: 8px; }
    .meta { font-size: 13px; color: #4a5f7a; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .to { font-weight: 600; color: #142D4E; }
    article p { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <h1>SMS enviados (<span id="count">0</span>)</h1>
    <button id="clear" type="button">Limpar</button>
  </header>
  <main id="list"><p class="empty">A carregar...</p></main>
  <script>
    // Lista actualizada a cada 3 s a partir de GET /sms (mais recente primeiro).
    const list = document.getElementById('list');
    const count = document.getElementById('count');

    function render(messages) {
      count.textContent = messages.length;
      list.replaceChildren();
      if (messages.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'Nenhum SMS recebido.';
        list.append(empty);
        return;
      }
      for (const m of messages) {
        const item = document.createElement('article');
        const meta = document.createElement('div');
        meta.className = 'meta';
        const to = document.createElement('span');
        to.className = 'to';
        to.textContent = m.to;
        const at = document.createElement('time');
        at.dateTime = m.receivedAt;
        at.textContent = new Date(m.receivedAt).toLocaleString('pt-MZ', { timeZone: 'Africa/Maputo' });
        meta.append(to, at);
        const text = document.createElement('p');
        text.textContent = m.text;
        item.append(meta, text);
        list.append(item);
      }
    }

    async function refresh() {
      try {
        const response = await fetch('sms', { cache: 'no-store' });
        if (response.ok) render(await response.json());
      } catch (e) {
        // Tenta de novo no próximo ciclo.
      }
    }

    document.getElementById('clear').addEventListener('click', async () => {
      await fetch('sms', { method: 'DELETE' });
      refresh();
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
