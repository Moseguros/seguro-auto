  /api/v1/insurer/proposals/{id}/accept:
    post:
      description: "Permissão proposal:decide. UNDER_REVIEW → ACCEPTED (acceptanceMode\
        \ = MANUAL), com o prazo para pagar (expiresAt). Com vistoria, tem de estar\
        \ APPROVED (409 INSPECTION_NOT_APPROVED); KYC VERIFIED ou total abaixo do\
        \ limiar do KYC simplificado (409 KYC_NOT_VERIFIED). note até 1000 (TOO_LONG).\
        \ Só em UNDER_REVIEW (senão 409 PROPOSAL_NOT_UNDER_REVIEW); version diferente\
        \ → 409 CONCURRENT_MODIFICATION; o cliente é avisado por e-mail (se o tiver\
        \ verificado)."
      operationId: acceptProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsurerProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
