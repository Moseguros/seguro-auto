  /api/v1/insurer/payments:
    get:
      description: "Permissão payment:read. Filtros: status repetível; method; from\
        \ e to em datas de Africa/Maputo (inclusivas, sobre createdAt); q igual à\
        \ referência PG-…, ao número do alvo ou ao id do fornecedor. Ordenação createdAt\
        \ (defeito, desc) ou amount."
      operationId: listInsurerPayments
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/PaymentStatus"
      - in: query
        name: method
        required: false
        schema:
          type: string
          enum:
          - MPESA
          - BANK_REFERENCE
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - description: "createdAt ou amount, com ,asc ou ,desc"
