      description: "Os dados do documento vêm do perfil. Perfil incompleto → 409 PROFILE_INCOMPLETE;\
        \ verificação em análise → 409 KYC_ALREADY_PENDING; identidade já verificada\
        \ (e perfil sem alterações) → 409 KYC_ALREADY_VERIFIED. Partes em falta ou\
        \ inválidas → 400 VALIDATION_ERROR (insurerId: REQUIRED ou INVALID_INSURER;\
        \ docFront e selfie: REQUIRED; docBack: REQUIRED no BI e no DIRE, NOT_ALLOWED\
        \ no passaporte). Cada ficheiro: JPEG, PNG ou HEIC até 10 MB (vazio → 400\
        \ FILE_EMPTY; maior → 413 FILE_TOO_LARGE; outro tipo → 415 FILE_TYPE_NOT_ALLOWED)."
      operationId: submitMyKyc
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                docBack:
                  type: string
                  format: binary
                docFront:
                  type: string
                  format: binary
                insurerId:
                  type: string
                  format: uuid
                  description: Seguradora a quem a verificação é enviada
                selfie:
                  type: string
                  format: binary
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycCheckResponse"
          description: Created
        "4XX":
          content:
            application/problem+json:
              schema:
