        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os pagamentos da seguradora
      tags:
      - Payment
  /api/v1/insurer/payments/export:
    get:
      description: "Permissão payment:read. Os mesmos filtros da lista. Filtros: status\
        \ repetível; method; from e to em datas de Africa/Maputo (inclusivas, sobre\
        \ createdAt); q igual à referência PG-…, ao número do alvo ou ao id do fornecedor.\
        \ CSV UTF-8 com BOM, separador ;, datas em Africa/Maputo (yyyy-MM-dd HH:mm:ss),\
        \ amount em meticais com vírgula decimal. Mais de 10 000 linhas → 400 EXPORT_TOO_LARGE."
      operationId: exportInsurerPayments
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/PaymentStatus"
      - in: query
        name: method
        required: false
        schema:
          type: string
          enum:
          - MPESA
          - BANK_REFERENCE
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: Ficheiro CSV
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Exporta os pagamentos da seguradora em CSV
      tags:
      - Payment
  /api/v1/insurer/payments/{id}:
    get:
