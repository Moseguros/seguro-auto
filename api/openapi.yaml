        \ obrigatório (REQUIRED, INVALID_VALUE); reason 10–1000 (REQUIRED, TOO_SHORT,\
        \ TOO_LONG); o motivo vai no e-mail ao cliente. Só em UNDER_REVIEW (senão\
        \ 409 PROPOSAL_NOT_UNDER_REVIEW); version diferente → 409 CONCURRENT_MODIFICATION;\
        \ o cliente é avisado por e-mail (se o tiver verificado)."
      operationId: rejectProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
