      - Payment
  /api/v1/insurer/payment-methods/{method}/enable:
    post:
      description: "Permissão payment:configure. Sem linha → 404 PAYMENT_METHOD_NOT_FOUND;\
        \ já activa → 409 INVALID_STATE_TRANSITION; dados incompletos (obrigatórios\
        \ do schema, regras da secção 4 ou segredo obrigatório em falta) → 409 PAYMENT_METHOD_INCOMPLETE\
        \ com errors[]; version diferente → 409 CONCURRENT_MODIFICATION."
      operationId: enableInsurerPaymentMethod
      parameters:
      - description: MPESA ou BANK_REFERENCE (outro → 404 PAYMENT_METHOD_NOT_FOUND)
        in: path
        name: method
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodVersionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
