openapi: 3.0.1
info:
  description: "API REST da plataforma MoSeguros. Erros em RFC 7807 (application/problem+json)\
    \ com `code` e `errors[]`."
  title: MoSeguros API
  version: 0.1.0-SNAPSHOT
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Informação técnica da aplicação
  name: Meta
- description: "Ficheiros: download com autorização do módulo dono"
  name: Document
- description: Envio de mensagens e recibos de entrega
  name: Notification
- description: "Organizações: seguradoras, mediadores, oficinas e outras"
  name: Organization
- description: "Identidade, sessões e utilizador autenticado"
  name: Identity
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Chaves públicas dos tokens (JWKS)
      tags:
      - Identity
  /api/v1/admin/invitations:
    get:
      description: "Permissão org-user:read e âmbito da plataforma. Ordenação por\
        \ createdAt, expiresAt ou email."
      operationId: listPlatformInvitations
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - example: "createdAt,desc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseInvitationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os convites da plataforma
      tags:
      - Identity
  /api/v1/admin/otp-settings:
    get:
      description: Permissão otp-settings:read.
      operationId: getOtpSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSettingsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Definições do OTP
      tags:
      - Identity
    put:
      description: Permissão otp-settings:manage. Todos os campos são obrigatórios;
        version diferente da gravada → 409 CONCURRENT_MODIFICATION.
      operationId: updateOtpSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOtpSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSettingsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera as definições do OTP
      tags:
      - Identity
  /api/v1/admin/otp-settings/test:
    post:
      description: "Permissão otp-settings:manage. Só pelo canal pedido, mesmo que\
        \ esteja desactivado, e sem alternativa; o código não serve para entrar. Conta\
        \ para o limite por hora."
      operationId: testOtpDelivery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpTestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpTestResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Envia um código de teste
      tags:
      - Identity
  /api/v1/admin/users:
    get:
      description: "Permissão org-user:read e âmbito da plataforma (senão 403 FORBIDDEN).\
        \ Filtros status e q. Ordenação por createdAt, email, displayName ou lastLoginAt."
      operationId: listPlatformUsers
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING_ACTIVATION
          - ACTIVE
          - LOCKED
          - DISABLED
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - example: "createdAt,desc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseStaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista o staff da plataforma
      tags:
      - Identity
    post:
      description: Permissão org-user:manage e âmbito da plataforma (senão 403 FORBIDDEN).
        Só perfis sem organização (excepto CUSTOMER). Convites pendentes para o mesmo
        e-mail são substituídos.
      operationId: invitePlatformUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: Created
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Convida staff da plataforma
      tags:
      - Identity
  /api/v1/auth/invitations/{token}:
    get:
      description: "Token desconhecido, convite expirado, revogado ou já aceite →\
        \ 404 INVITATION_INVALID."
      operationId: getInvitationByToken
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDetailsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Consulta um convite pelo token
      tags:
      - Identity
  /api/v1/auth/invitations/{token}/accept:
    post:
      description: "Aplica a política de palavras-passe (400 PASSWORD_TOO_WEAK) e\
        \ devolve um segredo TOTP novo. Pode repetir-se até à activação: cada chamada\
        \ substitui a palavra-passe e o segredo."
      operationId: acceptInvitation
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Define a palavra-passe e o TOTP
      tags:
      - Identity
  /api/v1/auth/invitations/{token}/activate:
    post:
      description: Sem accept antes → 400 INVITATION_NOT_ACCEPTED. Código errado →
        400 TOTP_INVALID; ao 5.º o convite é revogado (404 INVITATION_INVALID). Certo
        → conta activa e sessão iniciada.
      operationId: activateInvitation
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateInvitationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Activa a conta com o primeiro código TOTP
      tags:
      - Identity
  /api/v1/auth/login:
    post:
      description: "E-mail, palavra-passe e código TOTP. Qualquer um errado → 401\
        \ INVALID_CREDENTIALS (sem dizer qual). À 5.ª falha seguida a conta bloqueia\
        \ 15 minutos: 403 ACCOUNT_LOCKED com retryAfterSeconds e Retry-After. Credenciais\
        \ certas numa conta desactivada → 403 ACCOUNT_DISABLED; numa organização suspensa\
        \ → 403 ORGANIZATION_SUSPENDED. A sessão dura 12 h."
      operationId: loginStaff
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Login de staff
      tags:
      - Identity
  /api/v1/auth/logout:
    post:
      description: Revoga a sessão do refresh token. Responde 204 mesmo que o token
        seja desconhecido.
      operationId: logoutSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Termina a sessão
      tags:
      - Identity
  /api/v1/auth/otp/challenges/{challengeId}:
    get:
      description: Canal e estado de entrega do código activo (muda se houver alternativa
        de canal). Desconhecido → 404 OTP_CHALLENGE_NOT_FOUND.
      operationId: getOtpChallenge
      parameters:
      - in: path
        name: challengeId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Estado do envio do código
      tags:
      - Identity
  /api/v1/auth/otp/options:
    get:
      description: "Tipos de identificador e canais activos, conforme as definiçõ\
        es actuais."
      operationId: getOtpOptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpOptionsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Opções do login por código
      tags:
      - Identity
  /api/v1/auth/otp/request:
    post:
      description: "Envia um código pelo canal escolhido (ou o por defeito) e, se\
        \ falhar, pelos outros canais compatíveis. A resposta é igual para identificadores\
        \ novos e existentes."
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
          description: Código enviado
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Pede um código
      tags:
      - Identity
  /api/v1/auth/otp/verify:
    post:
      description: "Abre a sessão (e cria a conta de cliente, se ainda não existir)."
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Valida o código e entra
      tags:
      - Identity
  /api/v1/auth/password/forgot:
    post:
      description: "Responde sempre 202, sem corpo. Se o e-mail for de uma conta de\
        \ staff activa ou bloqueada, envia um link válido 30 minutos (no máximo 3\
        \ e-mails por conta por hora); os pedidos anteriores por usar deixam de funcionar."
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "202":
          description: Accepted
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Pede a recuperação da palavra-passe de staff
      tags:
      - Identity
  /api/v1/auth/password/reset:
    post:
      description: "Com o token do link. Token desconhecido, expirado, usado ou substituí\
        do → 400 RESET_TOKEN_INVALID; palavra-passe fraca → 400 PASSWORD_TOO_WEAK\
        \ (campo newPassword). Desbloqueia a conta e termina todas as sessões; o TOTP\
        \ não muda."
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Define a palavra-passe nova
      tags:
      - Identity
  /api/v1/auth/refresh:
    post:
      description: Troca o refresh token por um par novo (rotação). Um token já usado
        revoga a sessão inteira (401 REFRESH_TOKEN_REUSED); outro token recusado dá
        401 REFRESH_TOKEN_INVALID.
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Renova a sessão
      tags:
      - Identity
  /api/v1/files/{id}:
    get:
      description: "Público ou autenticado: sem token o pedido é anónimo; com token\
        \ inválido ou expirado dá 401. O módulo dono do ficheiro decide quem o lê\
        ; sem autorização, ficheiro inexistente ou já limpo → 404 FILE_NOT_FOUND (nunca\
        \ 403). Content-Type é o tipo real do ficheiro (image/jpeg, image/png, image/heic\
        \ ou application/pdf); download=true pede Content-Disposition attachment em\
        \ vez de inline."
      operationId: downloadFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: true → Content-Disposition attachment (guardar); false → inline
          (mostrar)
        in: query
        name: download
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: Conteúdo do ficheiro
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Descarrega um ficheiro
      tags:
      - Document
  /api/v1/integrations/delivery-receipts/{provider}:
    post:
      description: Actualiza o estado da mensagem. Segredo errado → 401 UNAUTHORIZED;
        fornecedor desconhecido → 404 NOT_FOUND; mensagem desconhecida → 204 (ignorado).
        Uma falha de um código OTP faz o backend tentar o canal seguinte.
      operationId: receiveDeliveryReceipt
      parameters:
      - description: "Valor da coluna provider (mock-sms, mock-whatsapp)"
        example: mock-sms
        in: path
        name: provider
        required: true
        schema:
          type: string
      - description: Segredo partilhado com o fornecedor
        in: header
        name: X-Webhook-Secret
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryReceiptRequest"
        required: true
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Recibo de entrega de um fornecedor
      tags:
      - Notification
  /api/v1/invitations/{id}/resend:
    post:
      description: "Permissão org-user:manage. Gera um token novo (o anterior deixa\
        \ de funcionar) válido por 7 dias. Só PENDING ou EXPIRED, senão 409 INVALID_STATE_TRANSITION."
      operationId: resendInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Reenvia um convite
      tags:
      - Identity
  /api/v1/invitations/{id}/revoke:
    post:
      description: "Permissão org-user:manage. Só PENDING ou EXPIRED, senão 409 INVALID_STATE_TRANSITION."
      operationId: revokeInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Revoga um convite
      tags:
      - Identity
  /api/v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Utilizador autenticado
      tags:
      - Identity
    put:
