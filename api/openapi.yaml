  /api/v1/proposals/{id}:
    get:
      description: "Permissão self:proposals (o cliente dono) ou proposal:create-for-client\
        \ (o mediador da proposta, S4-06). Outra → 404 PROPOSAL_NOT_FOUND. A seguradora\
        \ usa getInsurerProposal (S4-05)."
      operationId: getProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Consulta uma proposta
      tags:
      - Proposal
    put:
      description: Permissão self:proposals ou proposal:create-for-client. startDate
        entre hoje e hoje + 60 dias (Africa/Maputo; senão START_DATE_OUT_OF_RANGE);
        a duração e o prémio não mudam; o tomador é copiado de novo do perfil (perfil
        incompleto → 409 PROFILE_INCOMPLETE); com policyholderSource = BROKER (S4-06)
        mantém o tomador preenchido pelo mediador. Só em DRAFT ou INFO_REQUESTED (senão
        409 PROPOSAL_NOT_EDITABLE); version diferente → 409 CONCURRENT_MODIFICATION;
        proposta de outro cliente → 404 PROPOSAL_NOT_FOUND. Aumenta contentRevision
        e renova expiresAt (+15 dias).
      operationId: updateProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera a data de início da proposta
      tags:
      - Proposal
  /api/v1/proposals/{id}/declarations:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. As cinco\
        \ perguntas de api/proposal-questions.json, os campos de seguimento com resposta\
        \ sim e truthfulnessConfirmed = true; erros juntos em errors[] (400 VALIDATION_ERROR).\
        \ Só em DRAFT ou INFO_REQUESTED (senão 409 PROPOSAL_NOT_EDITABLE); version\
        \ diferente → 409 CONCURRENT_MODIFICATION; proposta de outro cliente → 404\
        \ PROPOSAL_NOT_FOUND. Aumenta contentRevision e renova expiresAt (+15 dias)."
      operationId: saveProposalDeclarations
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDeclarationsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Grava as declarações de risco
      tags:
      - Proposal
  /api/v1/proposals/{id}/inspection/photos:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. file:\
        \ JPEG, PNG ou HEIC até 10 MB (em falta → REQUIRED; vazio → 400 FILE_EMPTY;\
        \ maior → 413 FILE_TOO_LARGE; outro tipo → 415 FILE_TYPE_NOT_ALLOWED). slot\
        \ obrigatório (INVALID_SLOT); EXTRA além do máximo → EXTRA_PHOTOS_LIMIT; uma\
        \ fotografia nova num ângulo fixo substitui a anterior. takenAt no futuro\
        \ (+5 min) → PHOTO_IN_FUTURE, com mais de 7 dias → PHOTO_TOO_OLD; latitude\
        \ e longitude juntas e dentro dos limites (INVALID_COORDINATES). Com um clientPhotoId\
        \ já enviado devolve 200 com a mesma fotografia, sem gravar nada. Numa vistoria\
        \ REJECTED passa-a a PENDING. Proposta de outro cliente → 404 PROPOSAL_NOT_FOUND;\
        \ sem coberturas OD_* → 409 INSPECTION_NOT_REQUIRED; proposta fora de DRAFT/INFO_REQUESTED\
        \ → 409 PROPOSAL_NOT_EDITABLE; vistoria fora de PENDING/REJECTED → 409 INSPECTION_NOT_EDITABLE.\
        \ Aumenta contentRevision e renova expiresAt."
      operationId: uploadInspectionPhoto
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                clientPhotoId:
                  type: string
                  format: uuid
                  description: Gerado pelo cliente; torna o envio idempotente
                file:
                  type: string
                  format: binary
                latitude:
                  type: number
                  example: -25.965312
                longitude:
                  type: number
                  example: 32.583121
                slot:
                  $ref: "#/components/schemas/PhotoSlot"
                source:
                  $ref: "#/components/schemas/PhotoSource"
                takenAt:
                  type: string
                  format: date-time
                  description: Hora da fotografia (ISO 8601)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionPhotoResponse"
          description: Repetição do mesmo clientPhotoId
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionPhotoResponse"
          description: Fotografia gravada
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Envia uma fotografia da vistoria
      tags:
      - Proposal
  /api/v1/proposals/{id}/inspection/photos/{photoId}:
    delete:
      description: Permissão self:proposals ou proposal:create-for-client. Fica guardada
        com removedAt. Inexistente ou já retirada → 404 PHOTO_NOT_FOUND. Proposta
        de outro cliente → 404 PROPOSAL_NOT_FOUND; sem coberturas OD_* → 409 INSPECTION_NOT_REQUIRED;
        proposta fora de DRAFT/INFO_REQUESTED → 409 PROPOSAL_NOT_EDITABLE; vistoria
        fora de PENDING/REJECTED → 409 INSPECTION_NOT_EDITABLE. Aumenta contentRevision
        e renova expiresAt.
      operationId: removeInspectionPhoto
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: photoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Retira uma fotografia da vistoria
      tags:
      - Proposal
  /api/v1/proposals/{id}/inspection/request-on-site:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. PENDING\
        \ ou REJECTED → SUBMITTED com mode = ON_SITE; notes 10–500 (REQUIRED, TOO_SHORT,\
        \ TOO_LONG); as fotografias já enviadas ficam. A seguradora contacta o cliente\
        \ para marcar a visita; version da proposta diferente → 409 CONCURRENT_MODIFICATION.\
        \ Proposta de outro cliente → 404 PROPOSAL_NOT_FOUND; sem coberturas OD_*\
        \ → 409 INSPECTION_NOT_REQUIRED; proposta fora de DRAFT/INFO_REQUESTED → 409\
        \ PROPOSAL_NOT_EDITABLE; vistoria fora de PENDING/REJECTED → 409 INSPECTION_NOT_EDITABLE.\
        \ Aumenta contentRevision e renova expiresAt."
      operationId: requestOnSiteInspection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOnSiteInspectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Pede uma vistoria presencial
      tags:
      - Proposal
  /api/v1/proposals/{id}/inspection/submit:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. PENDING\
        \ → SUBMITTED com a quilometragem (REQUIRED, OUT_OF_RANGE). Faltam ângulos\
        \ → 409 INSPECTION_PHOTOS_MISSING (missingSlots); REJECTED sem fotografia\
        \ nova → 409 INVALID_STATE_TRANSITION; version da proposta diferente → 409\
        \ CONCURRENT_MODIFICATION. Proposta de outro cliente → 404 PROPOSAL_NOT_FOUND;\
        \ sem coberturas OD_* → 409 INSPECTION_NOT_REQUIRED; proposta fora de DRAFT/INFO_REQUESTED\
        \ → 409 PROPOSAL_NOT_EDITABLE; vistoria fora de PENDING/REJECTED → 409 INSPECTION_NOT_EDITABLE.\
        \ Aumenta contentRevision e renova expiresAt."
      operationId: submitInspection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInspectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Submete a vistoria por fotografias
      tags:
      - Proposal
  /api/v1/proposals/{id}/payment-intents:
    post:
      description: "Permissão self:payments. Cabeçalho Idempotency-Key obrigatório\
        \ (UUID; a mesma chave devolve a mesma resposta durante 24 h; outro pedido\
        \ com a mesma chave → 422 IDEMPOTENCY_KEY_REUSED). MPESA exige payerMsisdn\
        \ a começar por 84 ou 85 (REQUIRED, MSISDN_NOT_MPESA); BANK_REFERENCE devolve\
        \ já a entidade e a referência (nextAction PAY_BY_REFERENCE) e reutiliza a\
        \ referência activa com o mesmo montante. Erros: 404 PROPOSAL_NOT_FOUND; 409\
        \ PAYMENT_TARGET_NOT_PAYABLE, PAYMENT_TARGET_ALREADY_PAID, PAYMENT_METHOD_NOT_AVAILABLE,\
        \ PAYMENT_IN_PROGRESS (intentId)."
      operationId: createProposalPaymentIntent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposalPaymentIntentRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentView"
          description: Intenção criada
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Paga uma proposta aceite
      tags:
      - Proposal
  /api/v1/proposals/{id}/payment-methods:
    get:
      description: "Permissão self:payments. As formas de pagamento activas da seguradora,\
        \ dentro dos limites do montante, por sortOrder, e a intenção em curso (activeIntent)\
        \ para retomar. Proposta paga → paid = true sem métodos; fora de ACCEPTED\
        \ → 409 PAYMENT_TARGET_NOT_PAYABLE; de outro cliente → 404 PROPOSAL_NOT_FOUND."
      operationId: listProposalPaymentMethods
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalPaymentMethodsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Formas de pagamento de uma proposta aceite
      tags:
      - Proposal
  /api/v1/proposals/{id}/sign/confirm:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. Proposta\
        \ em DRAFT ou INFO_REQUESTED (senão 409 PROPOSAL_NOT_EDITABLE); sem pedido\
        \ em curso ou com outro challengeId → 409 SIGN_REQUEST_NOT_FOUND; proposta\
        \ alterada depois do pedido → 409 PROPOSAL_CHANGED_SINCE_SIGN_REQUEST (pedir\
        \ de novo); erros do código como no login (OTP_INVALID com attemptsRemaining,\
        \ OTP_EXPIRED, OTP_SUPERSEDED, OTP_ALREADY_USED, OTP_ATTEMPTS_EXCEEDED). Grava\
        \ a assinatura ligada ao hash do PDF (bloco signature, checklist.signature\
        \ = DONE) e renova expiresAt. Qualquer alteração posterior da proposta invalida\
        \ a assinatura. Confirmada por um utilizador do mediador (S4-06) → signature.assisted\
        \ = true; pelo próprio cliente → não assistida."
      operationId: confirmProposalSignature
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSignatureRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Confirma a assinatura com o código recebido
      tags:
      - Proposal
  /api/v1/proposals/{id}/sign/request:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. Por esta\
        \ ordem: proposta em DRAFT ou INFO_REQUESTED (senão 409 PROPOSAL_NOT_EDITABLE);\
        \ version diferente → 409 CONCURRENT_MODIFICATION; documentsAcknowledged ≠\
        \ true → 400 (campo documentsAcknowledged, MUST_BE_TRUE); passos em falta\
        \ → 409 PROPOSAL_INCOMPLETE com missing (DECLARATIONS, SUITABILITY, SUITABILITY_ACKNOWLEDGEMENT,\
        \ INSPECTION, START_DATE); sem telemóvel nem e-mail verificado → 409 SIGNER_CONTACT_MISSING.\
        \ Gera o PDF (SHA-256 em documentHash) e envia ao tomador um código que só\
        \ assina esse PDF; os limites do código são os do login (429 OTP_RATE_LIMITED\
        \ / OTP_RESEND_TOO_SOON com Retry-After). Pedir de novo substitui o pedido\
        \ anterior; não altera contentRevision. Proposta de outro cliente → 404 PROPOSAL_NOT_FOUND.\
        \ Pedido pelo mediador da proposta (S4-06): assinatura assistida, o código\
        \ vai para o telemóvel da conta do cliente com o nome do mediador na mensagem."
      operationId: requestProposalSignature
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestSignatureRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureRequestResponse"
          description: Código enviado
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Gera o PDF da proposta e envia o código de assinatura
      tags:
      - Proposal
  /api/v1/proposals/{id}/submit:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. Só em\
        \ DRAFT ou INFO_REQUESTED (senão 409 INVALID_STATE_TRANSITION); version diferente\
        \ → 409 CONCURRENT_MODIFICATION; proposta incompleta ou sem assinatura vá\
        lida → 409 PROPOSAL_INCOMPLETE (missing); seguradora não activa → 409 INSURER_NOT_ACTIVE.\
        \ As regras de aceitação do produto decidem logo: ACCEPTED (aceitação automá\
        tica, expiresAt = prazo para pagar) ou UNDER_REVIEW (decision.insurerDueAt\
        \ = prazo da seguradora). Depois de submetida, a proposta só se altera se\
        \ a seguradora pedir informação."
      operationId: submitProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Submete a proposta à seguradora
      tags:
      - Proposal
  /api/v1/proposals/{id}/suitability:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. Devolve\
        \ suitability.result (SUITABLE ou WARNED) e os motivos; limpa uma confirmaç\
        ão anterior dos avisos; erros juntos em errors[] (400 VALIDATION_ERROR). Só\
        \ em DRAFT ou INFO_REQUESTED (senão 409 PROPOSAL_NOT_EDITABLE); version diferente\
        \ → 409 CONCURRENT_MODIFICATION; proposta de outro cliente → 404 PROPOSAL_NOT_FOUND.\
        \ Aumenta contentRevision e renova expiresAt (+15 dias)."
      operationId: saveProposalSuitability
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSuitabilityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Grava o questionário de adequação
      tags:
      - Proposal
  /api/v1/proposals/{id}/suitability/acknowledge:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. O cliente\
        \ leu os avisos e quer continuar: preenche suitability.acknowledgedAt. Sem\
        \ WARNED → 409 SUITABILITY_NOT_WARNED. Só em DRAFT ou INFO_REQUESTED (senã\
        o 409 PROPOSAL_NOT_EDITABLE); version diferente → 409 CONCURRENT_MODIFICATION;\
        \ proposta de outro cliente → 404 PROPOSAL_NOT_FOUND. Aumenta contentRevision\
        \ e renova expiresAt (+15 dias)."
      operationId: acknowledgeProposalSuitability
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeSuitabilityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Confirma os avisos de adequação
      tags:
      - Proposal
  /api/v1/public/verifications:
    get:
      description: "Público, com CAPTCHA: cabeçalho X-Captcha-Token obrigatório quando\
        \ o fornecedor não é NONE (sem ele → 400 CAPTCHA_REQUIRED; recusado → 400\
        \ CAPTCHA_INVALID; fornecedor indisponível → 503 CAPTCHA_UNAVAILABLE). Matrí\
        cula em falta ou inválida → 400 VALIDATION_ERROR (plate, INVALID_PLATE); aceita\
        \ espaços, hífenes e minúsculas. 60 pedidos por minuto e por IP → 429 RATE_LIMITED\
        \ (Retry-After)."
      operationId: verifyPlate
      parameters:
      - description: Matrícula
        example: ABC-123-MC
        in: query
        name: plate
        required: false
        schema:
          type: string
      - description: Token do widget do CAPTCHA
        in: header
        name: X-Captcha-Token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVerificationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Verifica o seguro pela matrícula
      tags:
      - Verification
  /api/v1/public/verifications/config:
    get:
      description: "Público, sem limite de pedidos. captchaProvider TURNSTILE (com\
        \ captchaSiteKey) ou NONE (sem CAPTCHA; o cabeçalho X-Captcha-Token deixa\
        \ de ser exigido)."
      operationId: getVerificationConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationConfigResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: CAPTCHA da verificação por matrícula
      tags:
      - Verification
  /api/v1/public/verifications/{token}:
    get:
      description: "Público, sem CAPTCHA. O status é o da apólice agora; certificateStatus\
        \ diz se o certificado do código ainda é o actual. Código desconhecido ou\
        \ com formato errado → 200 NOT_FOUND. Nunca devolve dados do tomador nem os\
        \ números da apólice e do certificado. 60 pedidos por minuto e por IP → 429\
        \ RATE_LIMITED (Retry-After)."
      operationId: verifyCertificateToken
      parameters:
      - description: Código do QR do certificado (22 caracteres)
        in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVerificationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Verifica o seguro pelo código do QR
      tags:
      - Verification
  /api/v1/quotes:
    post:
      description: "Permissão self:quotes. Uma cotação por produto publicado compatí\
        vel de cada seguradora activa (OFFERED, ou NOT_AVAILABLE com unavailableReason),\
        \ em menos de 3 s, ordenadas por preço; valem 15 dias. Veículo ou condutor\
        \ de outro cliente → 404 VEHICLE_NOT_FOUND / DRIVER_NOT_FOUND. Danos próprios\
        \ sem valor comercial → 400 VEHICLE_VALUE_REQUIRED. Mais de 30 pedidos numa\
        \ hora → 429 QUOTE_RATE_LIMITED (Retry-After). Sem produtos compatíveis →\
        \ quotes: []."
      operationId: createQuoteRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Pede cotações para um veículo do cliente
      tags:
      - Rating
  /api/v1/quotes/{id}:
    get:
      description: Permissão self:quotes ou quote:create-for-client. O cliente vê
        os seus (também os do mediador em nome dele); o mediador os da sua organização.
        Outro → 404 QUOTE_REQUEST_NOT_FOUND. status é o estado efectivo (EXPIRED depois
        da validade ou da data de início).
      operationId: getQuoteRequest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Consulta um pedido de cotações
      tags:
      - Rating
  /api/v1/reference-domains/{domain}/values:
    get:
      description: "Público. Lista completa, não paginada, por sortOrder e labelPt.\
        \ Em VEHICLE_MODEL exclui os modelos de marcas inactivas; parentCode filtra\
        \ pela marca. Domínio desconhecido → 404 REFERENCE_DOMAIN_UNKNOWN."
      operationId: listReferenceValues
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
          enum:
          - VEHICLE_MAKE
          - VEHICLE_MODEL
          - LICENCE_CATEGORY
      - description: Só os valores com este pai (código da marca)
        example: TOYOTA
        in: query
        name: parentCode
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReferenceValuesResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os valores activos de um domínio
      tags:
      - Catalog
  /api/v1/roles:
    get:
      description: "Permissão org-user:read. Indicar organizationId ou scope=PLATFORM\
        \ (um dos dois), com as regras de âmbito dos convites. Devolve também os perfis\
        \ de gestor e os do primeiro gestor."
      operationId: listAssignableRoles
      parameters:
      - description: Organização (ou scope=PLATFORM)
        in: query
        name: organizationId
        required: false
        schema:
          type: string
          format: uuid
      - description: PLATFORM (ou organizationId)
        in: query
        name: scope
        required: false
        schema:
          type: string
          enum:
          - PLATFORM
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignableRolesResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Perfis atribuíveis
      tags:
      - Identity
  /api/v1/users/{id}:
    get:
      description: Permissão org-user:read. Fora do âmbito → 404 USER_NOT_FOUND.
      operationId: getStaffUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Consulta um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/disable:
    post:
      description: Permissão org-user:manage. ACTIVE ou LOCKED → DISABLED e revoga
        as sessões. O próprio → 400 CANNOT_MODIFY_SELF; último gestor activo → 400
        LAST_MANAGER; outro estado → 409 INVALID_STATE_TRANSITION.
      operationId: disableUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Desactiva um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/enable:
    post:
      description: Permissão org-user:manage. DISABLED → ACTIVE; outro estado → 409
        INVALID_STATE_TRANSITION.
      operationId: enableUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Reactiva um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/reset-access:
    post:
      description: "Permissão org-user:manage. Para quem perdeu o telemóvel do TOTP\
        \ ou não consegue entrar: a conta volta a PENDING_ACTIVATION sem palavra-passe\
        \ nem TOTP, as sessões são revogadas e é enviado um convite novo com os perfis\
        \ actuais. Só ACTIVE ou LOCKED (senão 409 INVALID_STATE_TRANSITION); o pró\
        prio → 400 CANNOT_MODIFY_SELF."
      operationId: resetUserAccess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Repõe o acesso de um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/roles:
    put:
      description: Permissão org-user:manage. Vale no login ou na renovação seguinte
        do token. O próprio → 400 CANNOT_MODIFY_SELF; perfil não permitido → 400 ROLE_NOT_ALLOWED_FOR_ORGANIZATION;
        retirar o último gestor activo → 400 LAST_MANAGER; conta por activar → 409
        INVALID_STATE_TRANSITION.
      operationId: updateUserRoles
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRolesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera os perfis de um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/unlock:
    post:
      description: Permissão org-user:manage. LOCKED → ACTIVE; outro estado → 409
        INVALID_STATE_TRANSITION.
      operationId: unlockUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Desbloqueia um utilizador de staff
      tags:
      - Identity
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: "12 a 128 caracteres, sem a parte local do e-mail e fora das\
            \ mais comuns (400 PASSWORD_TOO_WEAK com os motivos em errors[])"
      required:
      - password
    AcceptProposalRequest:
      type: object
      properties:
        note:
          type: string
          description: Nota opcional (até 1000 caracteres)
          maxLength: 1000
        version:
          type: integer
          format: int64
          description: Versão lida; diferente da gravada → 409 CONCURRENT_MODIFICATION
      required:
      - version
    AcceptanceMode:
      type: string
      description: Só em ACCEPTED (e nos estados seguintes)
      enum:
      - AUTOMATIC
      - MANUAL
      nullable: true
    AcknowledgeSuitabilityRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: Versão lida; diferente da gravada → 409 CONCURRENT_MODIFICATION
      required:
      - version
    ActivateInvitationRequest:
      type: object
      properties:
        totpCode:
          type: string
          example: "123456"
      required:
      - totpCode
    AdminPaymentFileSource:
      type: object
      properties:
        enabled:
          type: boolean
        entity:
          type: string
          example: "90002"
        fileFormat:
          type: string
          enum:
          - MEPS
          - BMEPS
        filesLast24h:
          type: integer
          format: int64
        insurer:
          $ref: "#/components/schemas/PaymentFileSourceInsurer"
        lastPollAt:
          type: string
          format: date-time
        lastPollError:
          type: string
          description: PollErrorCode (i18n pollErrorCode.*)
        lastPollOutcome:
          type: string
          enum:
          - OK
          - ERROR
        lastSuccessAt:
          type: string
          format: date-time
        rejectedLast24h:
          type: integer
          format: int64
        sourceId:
          type: string
          format: uuid
        staleSince:
          type: string
          format: date-time
      required:
      - enabled
      - filesLast24h
      - insurer
      - rejectedLast24h
      - sourceId
    AdminPaymentFileSources:
      type: object
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AdminPaymentFileSource"
      required:
      - sources
    ApproveInspectionRequest:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/InspectionMode"
        notes:
          type: string
          example: Vistoria feita na Matola em 08/01.
          maxLength: 1000
        version:
          type: integer
          format: int64
          description: Versão da vistoria; diferente da gravada → 409 CONCURRENT_MODIFICATION
      required:
      - version
    AssignableRolesResponse:
      type: object
      properties:
        managerInviteRoles:
          type: array
          description: Perfis a dar ao primeiro gestor no ecrã de criação de organização
          items:
            type: string
            description: Perfis a dar ao primeiro gestor no ecrã de criação de organização
        managerRoles:
          type: array
          description: "Perfis que fazem de alguém gestor (INSURER_ADMIN, ORG_ADMIN\
            \ ou PLATFORM_ADMIN)"
          items:
            type: string
            description: "Perfis que fazem de alguém gestor (INSURER_ADMIN, ORG_ADMIN\
              \ ou PLATFORM_ADMIN)"
        roles:
          type: array
          description: Perfis atribuíveis
          items:
            type: string
            description: Perfis atribuíveis
      required:
      - managerInviteRoles
      - managerRoles
      - roles
    BrokerPolicyholderRequest:
      type: object
      description: Só com policyholderSource = BROKER (senão NOT_ALLOWED); omitido
        mantém o actual
      properties:
        address:
          type: string
          example: "Bairro da Machava, Q. 12"
          maxLength: 300
        birthDate:
          type: string
          format: date
          description: "Pelo menos 18 anos, no máximo 120"
          example: 1991-09-09
        fullName:
          type: string
          description: "Letras, espaços, apóstrofo e hífen; pelo menos duas palavras"
          example: João Carlos Sitoe
          maxLength: 120
          minLength: 2
        idDocNumber:
          type: string
          description: "Maiúsculas e dígitos, 5–20 (espaços ignorados). Obrigatório\
            \ na criação; no updateBrokerProposal, omitido mantém o actual (se o tipo\
            \ não mudar)."
          example: 110100765432B
        idDocType:
          type: string
          enum:
          - BI
          - PASSPORT
          - DIRE
          example: BI
        nuit:
          type: string
          description: "9 dígitos. Obrigatório na criação; no updateBrokerProposal,\
            \ omitido mantém o actual."
          example: "123456789"
        province:
          type: string
          enum:
          - MAPUTO_CITY
          - MAPUTO
          - GAZA
          - INHAMBANE
          - SOFALA
          - MANICA
          - TETE
          - ZAMBEZIA
          - NAMPULA
          - CABO_DELGADO
          - NIASSA
      required:
      - birthDate
      - fullName
      - idDocType
      - province
    BrokerProposalDriverRequest:
      type: object
      properties:
        birthDate:
          type: string
          format: date
          example: 1991-09-09
        fullName:
          type: string
          description: "Letras, espaços, apóstrofo e hífen; pelo menos duas palavras"
          example: João Carlos Sitoe
          maxLength: 120
          minLength: 2
        isOwner:
          type: boolean
          description: O condutor é o próprio cliente (defeito false); só um por cliente
        licenceCategories:
          type: array
          description: "1–12 códigos activos em LICENCE_CATEGORY, sem repetidos"
          items:
            type: string
            description: "1–12 códigos activos em LICENCE_CATEGORY, sem repetidos"
        licenceIssueDate:
          type: string
          format: date
          example: 2011-04-04
        licenceNumber:
          type: string
          description: "5–20 letras, dígitos, / ou - (espaços ignorados). Nunca é\
            \ devolvido."
          example: MAP-123456
      required:
      - birthDate
      - fullName
      - licenceCategories
      - licenceIssueDate
      - licenceNumber
    BrokerProposalSummaryResponse:
      type: object
      properties:
        checklist:
          $ref: "#/components/schemas/ProposalChecklist"
        createdAt:
          type: string
          format: date-time
        customerMsisdnMasked:
          type: string
          example: +258*****4567
        customerName:
          type: string
          description: Nome do tomador
          example: João Carlos Sitoe
        expiresAt:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
          format: uuid
        insurer:
          $ref: "#/components/schemas/ProposalOrganization"
        number:
          type: string
          example: PR-2027-000123
        productName:
          type: string
          example: Auto Base
        status:
          $ref: "#/components/schemas/ProposalStatus"
        total:
          $ref: "#/components/schemas/Money"
      required:
      - checklist
      - createdAt
      - customerName
      - id
      - insurer
      - number
      - productName
      - status
      - total
    BrokerProposalVehicleRequest:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/VehicleCategory"
        chassisNumber:
          type: string
          description: 5–30 letras ou dígitos (espaços e hífens ignorados)
          example: JTDBR32E720012345
        commercialValue:
          $ref: "#/components/schemas/Money"
        engineCc:
          type: integer
          format: int32
          description: "1–30 000; obrigatório excepto em TRAILER, onde tem de faltar"
          example: 1600
        grossWeightKg:
          type: integer
          format: int32
          description: 1–100 000; obrigatório em HEAVY e TRAILER
          example: 40000
        hasTracker:
          type: boolean
          description: Localizador instalado (defeito false)
        make:
          type: string
          example: Toyota
          maxLength: 60
        model:
          type: string
          example: Corolla
          maxLength: 60
        plate:
          type: string
          description: "Num dos formatos activos (espaços, hífens e minúsculas aceites)"
          example: ABC-123-MC
        provinceOfCirculation:
          type: string
          enum:
          - MAPUTO_CITY
          - MAPUTO
          - GAZA
          - INHAMBANE
          - SOFALA
          - MANICA
          - TETE
          - ZAMBEZIA
          - NAMPULA
          - CABO_DELGADO
          - NIASSA
        seats:
          type: integer
          format: int32
          description: "TRAILER: 0; MOTORCYCLE: 1–3; outras: 1–100"
          example: 5
        usage:
          $ref: "#/components/schemas/VehicleUsage"
        year:
          type: integer
          format: int32
          description: De 1900 ao próximo ano (em Africa/Maputo)
          example: 2024
      required:
      - category
      - chassisNumber
      - make
      - model
      - plate
      - provinceOfCirculation
      - seats
      - usage
      - year
    BrokerVehicleRequest:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/VehicleCategory"
        commercialValue:
          $ref: "#/components/schemas/Money"
        engineCc:
          type: integer
          format: int32
          description: 1–30 000; em TRAILER tem de faltar
          example: 1600
        grossWeightKg:
          type: integer
          format: int32
          description: 1–100 000; obrigatório em HEAVY e TRAILER
        hasTracker:
          type: boolean
          description: Localizador instalado (defeito false)
        make:
          type: string
          example: Toyota
          maxLength: 60
        model:
          type: string
          example: Corolla
          maxLength: 60
        plate:
          type: string
          description: Opcional; num dos formatos activos (INVALID_PLATE)
          example: ABC-123-MC
        provinceOfCirculation:
          type: string
          enum:
          - MAPUTO_CITY
          - MAPUTO
          - GAZA
          - INHAMBANE
          - SOFALA
          - MANICA
          - TETE
          - ZAMBEZIA
          - NAMPULA
          - CABO_DELGADO
          - NIASSA
        seats:
          type: integer
          format: int32
          description: "TRAILER: 0; MOTORCYCLE: 1–3; outras: 1–100"
          example: 5
        usage:
          $ref: "#/components/schemas/VehicleUsage"
        year:
          type: integer
          format: int32
          description: De 1900 ao próximo ano
          example: 2024
      required:
      - category
      - provinceOfCirculation
      - seats
      - usage
      - year
    CaptchaProvider:
      type: string
      enum:
      - TURNSTILE
      - NONE
    CatalogInsurerResponse:
      type: object
      properties:
        displayName:
          type: string
          example: Seguradora Demo
        id:
          type: string
          format: uuid
      required:
      - displayName
      - id
    CatalogProductResponse:
      type: object
      properties:
        code:
          type: string
          example: AUTO-COMPLETO
        coverages:
          type: array
          items:
            $ref: "#/components/schemas/CoverageResponse"
        description:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ProductDocumentResponse"
        insurer:
          $ref: "#/components/schemas/CatalogInsurerResponse"
        name:
          type: string
          example: Auto Completo
        productId:
          type: string
          format: uuid
        productVersionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PUBLISHED
          - SUPERSEDED
          - RETIRED
        type:
          type: string
          enum:
          - MTPL_ONLY
          - COMPREHENSIVE
          - TEMPORARY
          - BORDER
          - FLEET
        usages:
          type: array
          items:
            $ref: "#/components/schemas/VehicleUsage"
        validFrom:
          type: string
          format: date
        validTo:
