          - MTPL_ONLY
          - COMPREHENSIVE
          - TEMPORARY
          - BORDER
          - FLEET
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseCatalogProductResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Lista os produtos publicados
      tags:
      - Catalog
  /api/v1/files/{id}:
    get:
      description: "Público ou autenticado: sem token o pedido é anónimo; com token\
        \ inválido ou expirado dá 401. O módulo dono do ficheiro decide quem o lê\
        ; sem autorização, ficheiro inexistente ou já limpo → 404 FILE_NOT_FOUND (nunca\
        \ 403). Content-Type é o tipo real do ficheiro (image/jpeg, image/png, image/heic\
        \ ou application/pdf); download=true pede Content-Disposition attachment em\
        \ vez de inline."
      operationId: downloadFile
