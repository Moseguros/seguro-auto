          example: ana@exemplo.co.mz
      required:
      - type
      - value
    SuspendOrganizationRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - reason
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "JWT de acesso (Bearer), válido 15 minutos"
        expiresIn:
          type: integer
          format: int64
          description: "Validade do token de acesso, em segundos"
          example: 900
        refreshToken:
          type: string
          description: Refresh token opaco; cada renovação devolve um novo
      required:
      - accessToken
      - expiresIn
      - refreshToken
    TotpSetupResponse:
      type: object
      properties:
        otpauthUri:
          type: string
          description: URI para o QR code
          example: otpauth://totp/MoSeguros:ana@seguradora.co.mz?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=MoSeguros&algorithm=SHA1&digits=6&period=30
        totpSecret:
          type: string
          description: Segredo em Base32 (entrada manual)
      required:
      - otpauthUri
      - totpSecret
    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          description: "Só staff, 2–120 caracteres; omitido mantém o actual. Ignorado\
            \ para clientes (o nome está no perfil)."
          example: Bruno Staff
        preferredLanguage:
          type: string
          enum:
          - pt
          - en
          example: pt
          pattern: pt|en
      required:
      - preferredLanguage
    UpdateMyProfileRequest:
      type: object
      properties:
        address:
          type: string
          example: "Av. Julius Nyerere, 1234"
          maxLength: 300
        birthDate:
          type: string
          format: date
          description: "Pelo menos 18 anos, no máximo 120"
          example: 1990-05-14
        fullName:
          type: string
          description: "Letras, espaços, apóstrofo e hífen; pelo menos duas palavras"
          example: Ana Maria Mussa
          maxLength: 120
          minLength: 2
        idDocNumber:
          type: string
          description: "Maiúsculas e dígitos, 5–20 (espaços ignorados). Obrigatório\
            \ se ainda não existir ou se idDocType mudar; omitido mantém o actual."
          example: 110100123345A
        idDocType:
          type: string
          enum:
          - BI
          - PASSPORT
          - DIRE
        nuit:
          type: string
          description: 9 dígitos. Obrigatório se ainda não existir; omitido mantém
            o actual.
          example: "123456789"
        province:
          type: string
          enum:
          - MAPUTO_CITY
          - MAPUTO
          - GAZA
          - INHAMBANE
          - SOFALA
          - MANICA
          - TETE
          - ZAMBEZIA
          - NAMPULA
          - CABO_DELGADO
          - NIASSA
        version:
          type: integer
          format: int64
          description: Versão lida; diferente da gravada → 409 CONCURRENT_MODIFICATION
      required:
      - birthDate
      - fullName
      - idDocType
      - province
      - version
    UpdateOrganizationRequest:
      type: object
      properties:
        address:
          type: string
          maxLength: 300
          minLength: 0
        contactEmail:
          type: string
        contactPhone:
          type: string
          pattern: "^\\+?[0-9]{9,15}$"
        insurerProfile:
          $ref: "#/components/schemas/InsurerProfileRequest"
        legalName:
          type: string
          maxLength: 200
          minLength: 2
        licenseNumber:
          type: string
          maxLength: 40
          minLength: 0
        nuit:
          $ref: "#/components/schemas/Nuit"
        province:
          type: string
          enum:
          - MAPUTO_CITY
          - MAPUTO
          - GAZA
          - INHAMBANE
          - SOFALA
          - MANICA
          - TETE
          - ZAMBEZIA
          - NAMPULA
          - CABO_DELGADO
          - NIASSA
        tradeName:
          type: string
          maxLength: 120
          minLength: 0
        version:
          type: integer
          format: int64
          description: Versão lida; diferente da gravada → 409 CONCURRENT_MODIFICATION
      required:
      - contactEmail
      - legalName
      - nuit
      - version
    UpdateOtpSettingsRequest:
      type: object
      properties:
        codeLength:
          type: integer
          format: int32
          description: 4 a 8
          example: 6
        customerCanChoose:
          type: boolean
        defaultChannel:
          type: string
          enum:
          - SMS
          - WHATSAPP
          - EMAIL
          example: SMS
        enabledChannels:
          type: array
          example:
          - SMS
          - WHATSAPP
          - EMAIL
          items:
            type: string
            enum:
            - SMS
            - WHATSAPP
            - EMAIL
            example: "[\"SMS\",\"WHATSAPP\",\"EMAIL\"]"
        fallbackOrder:
          type: array
          example:
          - SMS
          - WHATSAPP
          - EMAIL
          items:
            type: string
            enum:
            - SMS
            - WHATSAPP
            - EMAIL
            example: "[\"SMS\",\"WHATSAPP\",\"EMAIL\"]"
        maxAttempts:
          type: integer
          format: int32
          description: 1 a 10
          example: 3
        maxRequestsPerHour:
          type: integer
          format: int32
          description: 1 a 50
          example: 5
        resendAfterSeconds:
          type: integer
          format: int32
          description: 15 a 600
          example: 60
        validitySeconds:
          type: integer
          format: int32
          description: 60 a 1800
          example: 300
        version:
          type: integer
          format: int64
          description: version lida no GET
      required:
      - codeLength
      - customerCanChoose
      - defaultChannel
      - enabledChannels
      - fallbackOrder
      - maxAttempts
      - maxRequestsPerHour
      - resendAfterSeconds
      - validitySeconds
      - version
    UpdateUserRolesRequest:
      type: object
      properties:
        roleCodes:
          type: array
          description: Perfis permitidos no tipo da organização (400 ROLE_NOT_ALLOWED_FOR_ORGANIZATION)
          items:
            type: string
            example: UNDERWRITER
          maxItems: 20
          minItems: 1
        version:
          type: integer
          format: int64
          description: Versão lida; diferente da gravada → 409 CONCURRENT_MODIFICATION
      required:
      - roleCodes
      - version
    VerifyContactRequest:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: challengeId devolvido no pedido
        code:
          type: string
          example: "123456"
      required:
      - challengeId
      - code
    VerifyOtpRequest:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: challengeId devolvido no pedido
        code:
          type: string
          example: "123456"
      required:
      - challengeId
      - code
    VersionResponse:
      type: object
      properties:
        builtAt:
          type: string
          format: date-time
        commit:
          type: string
        name:
          type: string
        version:
          type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
