    post:
      description: "Permissão inspection:review. SUBMITTED → APPROVED. mode = ON_SITE\
        \ regista uma vistoria presencial e exige notes (REQUIRED); SELF_PHOTOS (ou\
        \ o modo da vistoria, sem mode) exige os seis ângulos (409 INSPECTION_PHOTOS_MISSING);\
        \ notes até 1000 (TOO_LONG). Proposta fora de UNDER_REVIEW → 409 PROPOSAL_NOT_UNDER_REVIEW;\
        \ version da vistoria diferente → 409 CONCURRENT_MODIFICATION; vistoria fora\
        \ de SUBMITTED → 409 INVALID_STATE_TRANSITION."
      operationId: approveInspection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveInspectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Aprova uma vistoria
      tags:
      - Proposal
