        name: q
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - description: "name, code ou createdAt, com ,asc ou ,desc"
        example: "name,asc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
