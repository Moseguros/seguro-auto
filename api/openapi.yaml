openapi: 3.0.1
info:
  description: "API REST da plataforma MoSeguros. Erros em RFC 7807 (application/problem+json)\
    \ com `code` e `errors[]`."
  title: MoSeguros API
  version: 0.1.0-SNAPSHOT
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Informação técnica da aplicação
  name: Meta
- description: "Pagamentos: formas de pagamento das seguradoras (M-Pesa e entidade\
    \ e referência), intenções de pagamento e pagamentos recebidos. O dinheiro vai\
    \ directamente para a conta da seguradora"
  name: Payment
- description: "Tarifação: tarifa interna das versões de produto, cotações e simulador"
  name: Rating
- description: "Verificação de seguro pela matrícula ou pelo QR do certificado: pú\
    blica (com CAPTCHA na matrícula) e para os agentes da polícia; nunca devolve dados\
    \ pessoais do tomador"
  name: Verification
- description: "Ficheiros: download com autorização do módulo dono"
  name: Document
- description: Envio de mensagens e recibos de entrega
  name: Notification
- description: "Apólices: emitidas automaticamente quando o pagamento da proposta\
    \ é confirmado, com as prestações e o certificado"
  name: Policy
- description: "Catálogo: tabelas de referência, parâmetros da plataforma, formatos\
    \ de matrícula, produtos das seguradoras e catálogo público"
  name: Catalog
- description: "Organizações: seguradoras, mediadores, oficinas e outras"
  name: Organization
- description: "Identidade, sessões e utilizador autenticado"
  name: Identity
- description: "Propostas: criação a partir de uma cotação, declarações de risco,\
    \ adequação, vistoria e assinatura"
  name: Proposal
- description: Veículos e condutores do cliente
  name: Vehicle
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Chaves públicas dos tokens (JWKS)
      tags:
      - Identity
  /api/v1/admin/invitations:
    get:
      description: "Permissão org-user:read e âmbito da plataforma. Ordenação por\
        \ createdAt, expiresAt ou email."
      operationId: listPlatformInvitations
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - EXPIRED
          - REVOKED
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - example: "createdAt,desc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseInvitationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os convites da plataforma
      tags:
      - Identity
  /api/v1/admin/otp-settings:
    get:
      description: Permissão otp-settings:read.
      operationId: getOtpSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSettingsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Definições do OTP
      tags:
      - Identity
    put:
      description: Permissão otp-settings:manage. Todos os campos são obrigatórios;
        version diferente da gravada → 409 CONCURRENT_MODIFICATION.
      operationId: updateOtpSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOtpSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSettingsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera as definições do OTP
      tags:
      - Identity
  /api/v1/admin/otp-settings/test:
    post:
      description: "Permissão otp-settings:manage. Só pelo canal pedido, mesmo que\
        \ esteja desactivado, e sem alternativa; o código não serve para entrar. Conta\
        \ para o limite por hora."
      operationId: testOtpDelivery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpTestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpTestResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Envia um código de teste
      tags:
      - Identity
  /api/v1/admin/payment-file-sources:
    get:
      description: "Permissão platform:operations. Todas as formas de pagamento BANK_REFERENCE\
        \ (activas e inactivas), por nome da seguradora, com a última leitura e os\
        \ ficheiros das últimas 24 h."
      operationId: listPaymentFileSources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentFileSources"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista as fontes de ficheiros de todas as seguradoras
      tags:
      - Payment
  /api/v1/admin/payment-worker-status:
    get:
      description: Permissão platform:operations. Mensagens e consumidores das quatro
        filas dos pagamentos e a última mensagem recebida. Broker inacessível → brokerReachable
        false e queues vazio.
      operationId: getPaymentWorkerStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWorkerStatus"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Estado das filas e do worker de ficheiros
      tags:
      - Payment
  /api/v1/admin/plate-formats:
    get:
      description: "Permissão reference:manage. Todos, incluindo os inactivos, por\
        \ sortOrder."
      operationId: listPlateFormats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlateFormatsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os formatos de matrícula (administração)
      tags:
      - Catalog
    post:
      description: Permissão reference:manage. Passa a ser aceite nos pedidos sem
        reiniciar. Código repetido → 409 PLATE_FORMAT_CODE_ALREADY_EXISTS.
      operationId: createPlateFormat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlateFormatRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlateFormatResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Cria um formato de matrícula
      tags:
      - Catalog
  /api/v1/admin/plate-formats/test:
    post:
      description: Permissão reference:manage. Não grava. As regras de pattern e displayTemplate
        aplicam-se (VALIDATION_ERROR).
      operationId: testPlateFormat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestPlateFormatRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestPlateFormatResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Experimenta um padrão com um valor
      tags:
      - Catalog
  /api/v1/admin/plate-formats/{id}:
    put:
      description: Permissão reference:manage. O código não muda; version diferente
        → 409 CONCURRENT_MODIFICATION; id desconhecido → 404 PLATE_FORMAT_NOT_FOUND.
      operationId: updatePlateFormat
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlateFormatRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlateFormatResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera um formato de matrícula
      tags:
      - Catalog
  /api/v1/admin/plate-formats/{id}/activate:
    post:
      description: Permissão reference:manage. Já activo → 409 INVALID_STATE_TRANSITION.
      operationId: activatePlateFormat
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlateFormatResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Activa um formato de matrícula
      tags:
      - Catalog
  /api/v1/admin/plate-formats/{id}/deactivate:
    post:
      description: Permissão reference:manage. Deixa de ser aceite em pedidos novos;
        as matrículas gravadas não mudam. Já inactivo → 409 INVALID_STATE_TRANSITION;
        último activo → 409 LAST_ACTIVE_PLATE_FORMAT.
      operationId: deactivatePlateFormat
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlateFormatResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Desactiva um formato de matrícula
      tags:
      - Catalog
  /api/v1/admin/platform-settings:
    get:
      description: Permissão reference:manage. Inclui versão e autor da última alteração.
      operationId: listPlatformSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettingsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os parâmetros da plataforma (administração)
      tags:
      - Catalog
  /api/v1/admin/platform-settings/{key}:
    put:
      description: Permissão reference:manage. Só o valor muda (as chaves entram por
        migração). Valor inválido para o tipo → VALIDATION_ERROR com INVALID_VALUE
        em value; chave desconhecida → 404 PLATFORM_SETTING_NOT_FOUND; version diferente
        → 409 CONCURRENT_MODIFICATION.
      operationId: updatePlatformSetting
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformSettingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettingResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera o valor de um parâmetro
      tags:
      - Catalog
  /api/v1/admin/reference-domains/{domain}/values:
    get:
      description: "Permissão reference:manage. Inclui os inactivos. q procura no\
        \ código e nos rótulos (sem diferenciar maiúsculas). Ordenação por sortOrder\
        \ (defeito, asc), labelPt ou createdAt."
      operationId: listAdminReferenceValues
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
          enum:
          - VEHICLE_MAKE
          - VEHICLE_MODEL
          - LICENCE_CATEGORY
      - in: query
        name: active
        required: false
        schema:
          type: boolean
      - in: query
        name: parentCode
        required: false
        schema:
          type: string
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - description: "sortOrder, labelPt ou createdAt, com ,asc ou ,desc"
        example: "sortOrder,asc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseReferenceValueResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os valores de um domínio (administração)
      tags:
      - Catalog
    post:
      description: "Permissão reference:manage. code ^[A-Z0-9_]{1,40}$ (INVALID_CODE);\
        \ parentCode obrigatório em VEHICLE_MODEL (REQUIRED, PARENT_NOT_FOUND) e proibido\
        \ nos outros (NOT_ALLOWED); código repetido no domínio → 409 REFERENCE_CODE_ALREADY_EXISTS."
      operationId: createReferenceValue
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
          enum:
          - VEHICLE_MAKE
          - VEHICLE_MODEL
          - LICENCE_CATEGORY
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReferenceValueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceValueResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Cria um valor de referência
      tags:
      - Catalog
  /api/v1/admin/reference-domains/{domain}/values/{id}:
    put:
      description: Permissão reference:manage. O código e a marca não mudam; version
        diferente da gravada → 409 CONCURRENT_MODIFICATION.
      operationId: updateReferenceValue
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
          enum:
          - VEHICLE_MAKE
          - VEHICLE_MODEL
          - LICENCE_CATEGORY
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReferenceValueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceValueResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera um valor de referência
      tags:
      - Catalog
  /api/v1/admin/reference-domains/{domain}/values/{id}/activate:
    post:
      description: Permissão reference:manage. Já activo → 409 INVALID_STATE_TRANSITION.
      operationId: activateReferenceValue
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
          enum:
          - VEHICLE_MAKE
          - VEHICLE_MODEL
          - LICENCE_CATEGORY
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceValueResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Activa um valor de referência
      tags:
      - Catalog
  /api/v1/admin/reference-domains/{domain}/values/{id}/deactivate:
    post:
      description: Permissão reference:manage. Sai das listas públicas; os registos
        que já o usam não mudam. Já inactivo → 409 INVALID_STATE_TRANSITION.
      operationId: deactivateReferenceValue
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
          enum:
          - VEHICLE_MAKE
          - VEHICLE_MODEL
          - LICENCE_CATEGORY
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceValueResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Desactiva um valor de referência
      tags:
      - Catalog
  /api/v1/admin/users:
    get:
      description: "Permissão org-user:read e âmbito da plataforma (senão 403 FORBIDDEN).\
        \ Filtros status e q. Ordenação por createdAt, email, displayName ou lastLoginAt."
      operationId: listPlatformUsers
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING_ACTIVATION
          - ACTIVE
          - LOCKED
          - DISABLED
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - example: "createdAt,desc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseStaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista o staff da plataforma
      tags:
      - Identity
    post:
      description: Permissão org-user:manage e âmbito da plataforma (senão 403 FORBIDDEN).
        Só perfis sem organização (excepto CUSTOMER). Convites pendentes para o mesmo
        e-mail são substituídos.
      operationId: invitePlatformUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: Created
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Convida staff da plataforma
      tags:
      - Identity
  /api/v1/auth/invitations/{token}:
    get:
      description: "Token desconhecido, convite expirado, revogado ou já aceite →\
        \ 404 INVITATION_INVALID."
      operationId: getInvitationByToken
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDetailsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Consulta um convite pelo token
      tags:
      - Identity
  /api/v1/auth/invitations/{token}/accept:
    post:
      description: "Aplica a política de palavras-passe (400 PASSWORD_TOO_WEAK) e\
        \ devolve um segredo TOTP novo. Pode repetir-se até à activação: cada chamada\
        \ substitui a palavra-passe e o segredo."
      operationId: acceptInvitation
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Define a palavra-passe e o TOTP
      tags:
      - Identity
  /api/v1/auth/invitations/{token}/activate:
    post:
      description: Sem accept antes → 400 INVITATION_NOT_ACCEPTED. Código errado →
        400 TOTP_INVALID; ao 5.º o convite é revogado (404 INVITATION_INVALID). Certo
        → conta activa e sessão iniciada.
      operationId: activateInvitation
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateInvitationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Activa a conta com o primeiro código TOTP
      tags:
      - Identity
  /api/v1/auth/login:
    post:
      description: "E-mail, palavra-passe e código TOTP. Qualquer um errado → 401\
        \ INVALID_CREDENTIALS (sem dizer qual). À 5.ª falha seguida a conta bloqueia\
        \ 15 minutos: 403 ACCOUNT_LOCKED com retryAfterSeconds e Retry-After. Credenciais\
        \ certas numa conta desactivada → 403 ACCOUNT_DISABLED; numa organização suspensa\
        \ → 403 ORGANIZATION_SUSPENDED. A sessão dura 12 h."
      operationId: loginStaff
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Login de staff
      tags:
      - Identity
  /api/v1/auth/logout:
    post:
      description: Revoga a sessão do refresh token. Responde 204 mesmo que o token
        seja desconhecido.
      operationId: logoutSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Termina a sessão
      tags:
      - Identity
  /api/v1/auth/otp/challenges/{challengeId}:
    get:
      description: Canal e estado de entrega do código activo (muda se houver alternativa
        de canal). Desconhecido → 404 OTP_CHALLENGE_NOT_FOUND.
      operationId: getOtpChallenge
      parameters:
      - in: path
        name: challengeId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Estado do envio do código
      tags:
      - Identity
  /api/v1/auth/otp/options:
    get:
      description: "Tipos de identificador e canais activos, conforme as definiçõ\
        es actuais."
      operationId: getOtpOptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpOptionsResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Opções do login por código
      tags:
      - Identity
  /api/v1/auth/otp/request:
    post:
      description: "Envia um código pelo canal escolhido (ou o por defeito) e, se\
        \ falhar, pelos outros canais compatíveis. A resposta é igual para identificadores\
        \ novos e existentes."
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
          description: Código enviado
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Pede um código
      tags:
      - Identity
  /api/v1/auth/otp/verify:
    post:
      description: "Abre a sessão (e cria a conta de cliente, se ainda não existir)."
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Valida o código e entra
      tags:
      - Identity
  /api/v1/auth/password/forgot:
    post:
      description: "Responde sempre 202, sem corpo. Se o e-mail for de uma conta de\
        \ staff activa ou bloqueada, envia um link válido 30 minutos (no máximo 3\
        \ e-mails por conta por hora); os pedidos anteriores por usar deixam de funcionar."
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "202":
          description: Accepted
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Pede a recuperação da palavra-passe de staff
      tags:
      - Identity
  /api/v1/auth/password/reset:
    post:
      description: "Com o token do link. Token desconhecido, expirado, usado ou substituí\
        do → 400 RESET_TOKEN_INVALID; palavra-passe fraca → 400 PASSWORD_TOO_WEAK\
        \ (campo newPassword). Desbloqueia a conta e termina todas as sessões; o TOTP\
        \ não muda."
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Define a palavra-passe nova
      tags:
      - Identity
  /api/v1/auth/refresh:
    post:
      description: Troca o refresh token por um par novo (rotação). Um token já usado
        revoga a sessão inteira (401 REFRESH_TOKEN_REUSED); outro token recusado dá
        401 REFRESH_TOKEN_INVALID.
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Renova a sessão
      tags:
      - Identity
  /api/v1/broker/proposals:
    get:
      description: "Permissão proposal:create-for-client (corretor ou agente). Propostas\
        \ criadas por qualquer utilizador da organização; status repetível (vazio\
        \ = todos); q = número exacto ou parte do nome do tomador. Ordenação por createdAt\
        \ (defeito createdAt,desc)."
      operationId: listBrokerProposals
      parameters:
      - description: Estados a incluir (repetível); vazio = todos
        in: query
        name: status
        required: false
        schema:
          type: array
          items:
            $ref: "#/components/schemas/ProposalStatus"
      - description: Número exacto ou parte do nome do tomador
        example: PR-2027-000123
        in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - description: "createdAt, com ,asc ou ,desc"
        example: "createdAt,desc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseBrokerProposalSummaryResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista as propostas da organização do mediador
      tags:
      - Proposal
    post:
      description: "Permissão proposal:create-for-client (corretor ou agente). Por\
        \ esta ordem: cotação não visível, do cliente ou de outra organização → 404\
        \ QUOTE_NOT_FOUND; já usada numa proposta → 409 PROPOSAL_ALREADY_EXISTS; QUOTE_NOT_AVAILABLE,\
        \ QUOTE_ALREADY_USED, QUOTE_EXPIRED (409); seguradora não activa → 409 INSURER_NOT_ACTIVE;\
        \ vehicle ou driver em falta → 400 REQUIRED; campos usados na tarifa diferentes\
        \ dos da cotação → 409 QUOTE_DATA_CHANGED (fields, ex.: vehicle.year); conta\
        \ do cliente desactivada → 409 CLIENT_ACCOUNT_DISABLED; perfil do cliente\
        \ completo e policyholder enviado → 400 NOT_ALLOWED (policyholder); perfil\
        \ incompleto sem policyholder → 400 REQUIRED (policyholder), com as regras\
        \ do perfil (errors[].field policyholder.*); regras do veículo e do condutor\
        \ do S2-03 (errors[].field vehicle.* e driver.*; VEHICLE_ALREADY_REGISTERED\
        \ com a mesma matrícula e outro chassis, VEHICLE_LIMIT_REACHED, DRIVER_LIMIT_REACHED).\
        \ Regista o veículo e o condutor na conta do cliente (reutiliza os iguais),\
        \ grava a proposta DRAFT com channel = BROKER e a cotação passa a USED. Qualquer\
        \ erro desfaz tudo. O cliente vê a proposta em listMyProposals e recebe um\
        \ e-mail se tiver e-mail verificado."
      operationId: createProposalForClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrokerProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Cria uma proposta a partir da cotação do mediador
      tags:
      - Proposal
  /api/v1/broker/proposals/{id}:
    put:
      description: "Permissão proposal:create-for-client (corretor ou agente). Só\
        \ em DRAFT ou INFO_REQUESTED (senão 409 PROPOSAL_NOT_EDITABLE); version diferente\
        \ → 409 CONCURRENT_MODIFICATION; proposta de outra organização → 404 PROPOSAL_NOT_FOUND.\
        \ startDate entre hoje e hoje + 60 dias (START_DATE_OUT_OF_RANGE); policyholder\
        \ só com policyholderSource = BROKER (senão 400 NOT_ALLOWED), com as regras\
        \ do perfil (idDocNumber e nuit omitidos mantêm os actuais); sem nenhum dos\
        \ dois → 400 REQUIRED (startDate). Com policyholderSource = PROFILE o tomador\
        \ é copiado de novo do perfil. Aumenta contentRevision, invalida a assinatura\
        \ e renova expiresAt. O veículo e o condutor não mudam (mudar o risco exige\
        \ nova cotação)."
      operationId: updateBrokerProposal
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrokerProposalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera a data de início ou o tomador
      tags:
      - Proposal
  /api/v1/broker/proposals/{id}/payment-link:
    post:
      description: "Permissão payment:link-for-client. SMS ao telemóvel do cliente\
        \ com o link {web}/cliente/propostas/{id}/pagar?origem=mediador. Só propostas\
        \ deste mediador (senão 404 PROPOSAL_NOT_FOUND) em ACCEPTED (409 PAYMENT_TARGET_NOT_PAYABLE);\
        \ cliente sem telemóvel → 409 CUSTOMER_HAS_NO_MSISDN; no máximo 3 envios por\
        \ proposta em 24 h (429 PAYMENT_LINK_RATE_LIMITED, retryAfterSeconds)."
      operationId: sendProposalPaymentLink
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"
          description: Accepted
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Envia ao cliente o link de pagamento
      tags:
      - Proposal
  /api/v1/broker/quotes:
    get:
      description: "Permissão quote:create-for-client. Pedidos de todos os utilizadores\
        \ da organização do mediador; clientMsisdn (opcional) filtra pelo telemóvel\
        \ do cliente (INVALID_MSISDN). Ordenação por createdAt (defeito createdAt,desc)."
      operationId: listBrokerQuoteRequests
      parameters:
      - description: Telemóvel do cliente
        example: "+258841234567"
        in: query
        name: clientMsisdn
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - description: "createdAt, com ,asc ou ,desc"
        example: "createdAt,desc"
        in: query
        name: sort
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseQuoteRequestSummaryResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os pedidos de cotações da organização
      tags:
      - Rating
    post:
      description: "Permissão quote:create-for-client (corretor ou agente). Dados\
        \ do veículo e do condutor escritos à mão (só o que a tarifa usa) e o telemó\
        vel do cliente: a conta do cliente é encontrada ou criada (telemóvel por verificar),\
        \ sem mensagem nenhuma. O cliente vê o pedido em listMyQuoteRequests com origin\
        \ = BROKER. Mesmas regras e respostas de createQuoteRequest."
      operationId: createBrokerQuoteRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrokerQuoteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Pede cotações em nome de um cliente
      tags:
      - Rating
  /api/v1/catalog/product-versions/{id}:
    get:
      description: "Público. Qualquer versão que foi publicada (também SUPERSEDED\
        \ e RETIRED, para quem tem uma apólice antiga), de uma seguradora activa,\
        \ com as coberturas completas; senão 404 PRODUCT_VERSION_NOT_FOUND."
      operationId: getCatalogProductVersion
      parameters:
