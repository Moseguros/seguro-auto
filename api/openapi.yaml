        \ o prazo do cliente (expiresAt). message 10–1000 (REQUIRED, TOO_SHORT, TOO_LONG);\
        \ items 1+ sem repetidos (REQUIRED, INVALID_VALUE, ANSWER_DUPLICATED). A assinatura\
        \ deixa de valer (o cliente assina de novo); com o item INSPECTION a vistoria\
        \ volta a PENDING. Só em UNDER_REVIEW (senão 409 PROPOSAL_NOT_UNDER_REVIEW);\
        \ version diferente → 409 CONCURRENT_MODIFICATION; o cliente é avisado por\
        \ e-mail (se o tiver verificado)."
      operationId: requestProposalInfo
