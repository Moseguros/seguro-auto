          - BROKER
          - AGENT
          - WORKSHOP
          - ASSESSOR
          - ASSISTANCE
          - OMBUDSMAN
          - REGULATOR
          - POLICE
          - CORPORATE_CLIENT
      - in: query
        name: status
        required: false
        schema:
          type: string
