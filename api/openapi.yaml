        1000 (REQUIRED, TOO_SHORT, TOO_LONG) e os ângulos a repetir (INVALID_SLOT,\
        \ DUPLICATED). A proposta continua UNDER_REVIEW: para o cliente refazer, pede-se\
        \ informação (S4-05) ou recusa-se a proposta. Proposta fora de UNDER_REVIEW\
        \ → 409 PROPOSAL_NOT_UNDER_REVIEW; version da vistoria diferente → 409 CONCURRENT_MODIFICATION;\
        \ vistoria fora de SUBMITTED → 409 INVALID_STATE_TRANSITION."
      operationId: rejectInspection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInspectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Recusa uma vistoria
      tags:
      - Proposal
