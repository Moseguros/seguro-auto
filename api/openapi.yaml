            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Consulta uma versão publicada
      tags:
      - Catalog
  /api/v1/catalog/products:
    get:
      description: "Público. Versões em vigor de produtos não retirados de seguradoras\
        \ activas, por nome da seguradora e depois do produto (ordem fixa). Com vehicleCategory\
        \ ou usage, só as versões que os incluem. As coberturas levam só capital e\
        \ franquia."
      operationId: listCatalogProducts
      parameters:
      - in: query
        name: vehicleCategory
