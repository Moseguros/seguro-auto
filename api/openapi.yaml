openapi: 3.0.1
info:
  description: "API REST da plataforma MoSeguros. Erros em RFC 7807 (application/problem+json)\
    \ com `code` e `errors[]`."
  title: MoSeguros API
  version: 0.1.0-SNAPSHOT
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: Informação técnica da aplicação
  name: Meta
- description: "Identidade, sessões e utilizador autenticado"
  name: Identity
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Chaves públicas dos tokens (JWKS)
      tags:
      - Identity
  /api/v1/auth/logout:
    post:
      description: Revoga a sessão do refresh token. Responde 204 mesmo que o token
        seja desconhecido.
      operationId: logoutSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Termina a sessão
      tags:
      - Identity
  /api/v1/auth/refresh:
    post:
      description: Troca o refresh token por um par novo (rotação). Um token já usado
        revoga a sessão inteira (401 REFRESH_TOKEN_REUSED); outro token recusado dá
        401 REFRESH_TOKEN_INVALID.
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Renova a sessão
      tags:
      - Identity
  /api/v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Utilizador autenticado
      tags:
      - Identity
  /api/v1/meta/version:
    get:
      operationId: getVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      security: []
      summary: Versão da API
      tags:
      - Meta
components:
  schemas:
    FieldError:
      type: object
      description: Erro de um campo do pedido
      properties:
        code:
          type: string
          description: Código do erro do campo
          example: INVALID_PLATE
        field:
          type: string
          description: Caminho JSON do campo
          example: vehicle.plate
        message:
          type: string
          description: Mensagem técnica (não para o utilizador)
      required:
      - field
      - code
    Jwk:
      type: object
      properties:
        alg:
          type: string
          example: RS256
        e:
          type: string
          description: Expoente (Base64 URL)
          example: AQAB
        kid:
          type: string
          example: dev
        kty:
          type: string
          example: RSA
        "n":
          type: string
          description: Módulo (Base64 URL)
        use:
          type: string
          example: sig
      required:
      - alg
      - e
      - kid
      - kty
      - "n"
      - use
    JwksResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"
      required:
      - keys
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token da sessão a terminar
    Matricula:
      type: string
      description: Matrícula formatada; os formatos aceites são configuráveis
      example: ABC-123-MC
      pattern: "^[A-Z0-9]+(-[A-Z0-9]+)*$"
    MeOrganization:
      type: object
      description: Organização do staff; omitida para clientes e staff da plataforma
      properties:
        displayName:
          type: string
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - INSURER
          - BROKER
          - AGENT
          - WORKSHOP
          - ASSESSOR
          - ASSISTANCE
          - OMBUDSMAN
          - REGULATOR
          - POLICE
          - CORPORATE_CLIENT
      required:
      - displayName
      - id
      - type
    MeResponse:
      type: object
      properties:
        displayName:
          type: string
          description: "Staff: nome da conta; cliente: nome completo do perfil"
        email:
          type: string
        emailVerified:
          type: boolean
        id:
          type: string
          format: uuid
        msisdn:
          $ref: "#/components/schemas/Msisdn"
        msisdnVerified:
          type: boolean
        organization:
          $ref: "#/components/schemas/MeOrganization"
        permissions:
          type: array
          items:
            type: string
        preferredLanguage:
          type: string
          example: pt
        profileComplete:
          type: boolean
          description: "Só clientes: o perfil tem todos os dados obrigatórios"
        roles:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
          - CUSTOMER
          - STAFF
      required:
      - emailVerified
      - id
      - msisdnVerified
      - permissions
      - preferredLanguage
      - roles
      - type
    Money:
      type: object
      description: Valor monetário em centavos
      properties:
        amount:
          type: integer
          format: int64
          example: 299900
        currency:
          type: string
          enum:
          - MZN
          example: MZN
      required:
      - amount
      - currency
    Msisdn:
      type: string
      description: Telemóvel moçambicano em E.164
      example: "+258841234567"
      pattern: "^\\+2588[2-7]\\d{7}$"
    Nuit:
      type: string
      description: "NUIT: 9 dígitos"
      example: "123456789"
      pattern: "^\\d{9}$"
    ProblemDetail:
      type: object
      description: Erro RFC 7807 (application/problem+json)
      properties:
        code:
          type: string
          description: Código do erro (ErrorCodes)
          example: VALIDATION_ERROR
        detail:
          type: string
          example: Request validation failed
        errors:
          type: array
          description: "Erros por campo, quando o pedido é inválido"
          items:
            $ref: "#/components/schemas/FieldError"
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
          example: 400
        title:
          type: string
          example: Bad Request
        type:
          type: string
          format: uri
          example: https://moseguros.co.mz/problems/validation-error
      required:
      - type
      - title
      - status
      - code
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token recebido no login ou na última renovação
      required:
      - refreshToken
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "JWT de acesso (Bearer), válido 15 minutos"
        expiresIn:
          type: integer
          format: int64
          description: "Validade do token de acesso, em segundos"
          example: 900
        refreshToken:
          type: string
          description: Refresh token opaco; cada renovação devolve um novo
      required:
      - accessToken
      - expiresIn
      - refreshToken
    VersionResponse:
      type: object
      properties:
        builtAt:
          type: string
          format: date-time
        commit:
          type: string
        name:
          type: string
        version:
          type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
