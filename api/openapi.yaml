  /api/v1/insurer/payment-methods/{method}/test:
    post:
      description: "Permissão payment:configure. Usa os dados gravados (grave antes\
        \ de testar); sem linha → 404 PAYMENT_METHOD_NOT_FOUND. BANK_REFERENCE valida\
        \ a configuração e a existência dos segredos SFTP no cofre, sem ligar ao SFTP\
        \ (CONFIG_VALID, SETTINGS_INVALID, SECRET_MISSING); sem tester para o método\
        \ → NOT_SUPPORTED. Até 15 s (TIMEOUT)."
      operationId: testInsurerPaymentMethod
      parameters:
      - description: MPESA ou BANK_REFERENCE (outro → 404 PAYMENT_METHOD_NOT_FOUND)
        in: path
        name: method
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodTestResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Testa uma forma de pagamento
      tags:
