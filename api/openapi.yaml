        \ JPEG, PNG ou HEIC até 10 MB (em falta → REQUIRED; vazio → 400 FILE_EMPTY;\
        \ maior → 413 FILE_TOO_LARGE; outro tipo → 415 FILE_TYPE_NOT_ALLOWED). slot\
        \ obrigatório (INVALID_SLOT); EXTRA além do máximo → EXTRA_PHOTOS_LIMIT; uma\
        \ fotografia nova num ângulo fixo substitui a anterior. takenAt no futuro\
        \ (+5 min) → PHOTO_IN_FUTURE, com mais de 7 dias → PHOTO_TOO_OLD; latitude\
        \ e longitude juntas e dentro dos limites (INVALID_COORDINATES). Com um clientPhotoId\
        \ já enviado devolve 200 com a mesma fotografia, sem gravar nada. Numa vistoria\
        \ REJECTED passa-a a PENDING. Proposta de outro cliente → 404 PROPOSAL_NOT_FOUND;\
        \ sem coberturas OD_* → 409 INSPECTION_NOT_REQUIRED; proposta fora de DRAFT/INFO_REQUESTED\
        \ → 409 PROPOSAL_NOT_EDITABLE; vistoria fora de PENDING/REJECTED → 409 INSPECTION_NOT_EDITABLE.\
        \ Aumenta contentRevision e renova expiresAt."
      operationId: uploadInspectionPhoto
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                clientPhotoId:
                  type: string
                  format: uuid
                  description: Gerado pelo cliente; torna o envio idempotente
                file:
                  type: string
                  format: binary
                latitude:
                  type: number
                  example: -25.965312
                longitude:
                  type: number
                  example: 32.583121
                slot:
                  $ref: "#/components/schemas/PhotoSlot"
                source:
                  $ref: "#/components/schemas/PhotoSource"
                takenAt:
                  type: string
                  format: date-time
                  description: Hora da fotografia (ISO 8601)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionPhotoResponse"
          description: Repetição do mesmo clientPhotoId
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionPhotoResponse"
          description: Fotografia gravada
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Envia uma fotografia da vistoria
      tags:
      - Proposal
  /api/v1/proposals/{id}/inspection/photos/{photoId}:
    delete:
      description: Permissão self:proposals ou proposal:create-for-client. Fica guardada
        com removedAt. Inexistente ou já retirada → 404 PHOTO_NOT_FOUND. Proposta
        de outro cliente → 404 PROPOSAL_NOT_FOUND; sem coberturas OD_* → 409 INSPECTION_NOT_REQUIRED;
        proposta fora de DRAFT/INFO_REQUESTED → 409 PROPOSAL_NOT_EDITABLE; vistoria
        fora de PENDING/REJECTED → 409 INSPECTION_NOT_EDITABLE. Aumenta contentRevision
        e renova expiresAt.
      operationId: removeInspectionPhoto
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: photoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Retira uma fotografia da vistoria
      tags:
      - Proposal
  /api/v1/proposals/{id}/inspection/request-on-site:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. PENDING\
        \ ou REJECTED → SUBMITTED com mode = ON_SITE; notes 10–500 (REQUIRED, TOO_SHORT,\
        \ TOO_LONG); as fotografias já enviadas ficam. A seguradora contacta o cliente\
        \ para marcar a visita; version da proposta diferente → 409 CONCURRENT_MODIFICATION.\
        \ Proposta de outro cliente → 404 PROPOSAL_NOT_FOUND; sem coberturas OD_*\
        \ → 409 INSPECTION_NOT_REQUIRED; proposta fora de DRAFT/INFO_REQUESTED → 409\
        \ PROPOSAL_NOT_EDITABLE; vistoria fora de PENDING/REJECTED → 409 INSPECTION_NOT_EDITABLE.\
        \ Aumenta contentRevision e renova expiresAt."
      operationId: requestOnSiteInspection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOnSiteInspectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Pede uma vistoria presencial
      tags:
      - Proposal
  /api/v1/proposals/{id}/inspection/submit:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. PENDING\
        \ → SUBMITTED com a quilometragem (REQUIRED, OUT_OF_RANGE). Faltam ângulos\
        \ → 409 INSPECTION_PHOTOS_MISSING (missingSlots); REJECTED sem fotografia\
        \ nova → 409 INVALID_STATE_TRANSITION; version da proposta diferente → 409\
        \ CONCURRENT_MODIFICATION. Proposta de outro cliente → 404 PROPOSAL_NOT_FOUND;\
        \ sem coberturas OD_* → 409 INSPECTION_NOT_REQUIRED; proposta fora de DRAFT/INFO_REQUESTED\
        \ → 409 PROPOSAL_NOT_EDITABLE; vistoria fora de PENDING/REJECTED → 409 INSPECTION_NOT_EDITABLE.\
        \ Aumenta contentRevision e renova expiresAt."
      operationId: submitInspection
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInspectionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Submete a vistoria por fotografias
      tags:
      - Proposal
  /api/v1/proposals/{id}/suitability:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. Devolve\
        \ suitability.result (SUITABLE ou WARNED) e os motivos; limpa uma confirmaç\
        ão anterior dos avisos; erros juntos em errors[] (400 VALIDATION_ERROR). Só\
        \ em DRAFT ou INFO_REQUESTED (senão 409 PROPOSAL_NOT_EDITABLE); version diferente\
        \ → 409 CONCURRENT_MODIFICATION; proposta de outro cliente → 404 PROPOSAL_NOT_FOUND.\
        \ Aumenta contentRevision e renova expiresAt (+15 dias)."
      operationId: saveProposalSuitability
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSuitabilityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Grava o questionário de adequação
      tags:
      - Proposal
  /api/v1/proposals/{id}/suitability/acknowledge:
    post:
      description: "Permissão self:proposals ou proposal:create-for-client. O cliente\
        \ leu os avisos e quer continuar: preenche suitability.acknowledgedAt. Sem\
        \ WARNED → 409 SUITABILITY_NOT_WARNED. Só em DRAFT ou INFO_REQUESTED (senã\
        o 409 PROPOSAL_NOT_EDITABLE); version diferente → 409 CONCURRENT_MODIFICATION;\
        \ proposta de outro cliente → 404 PROPOSAL_NOT_FOUND. Aumenta contentRevision\
        \ e renova expiresAt (+15 dias)."
      operationId: acknowledgeProposalSuitability
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeSuitabilityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Confirma os avisos de adequação
      tags:
      - Proposal
  /api/v1/quotes:
    post:
      description: "Permissão self:quotes. Uma cotação por produto publicado compatí\
        vel de cada seguradora activa (OFFERED, ou NOT_AVAILABLE com unavailableReason),\
        \ em menos de 3 s, ordenadas por preço; valem 15 dias. Veículo ou condutor\
        \ de outro cliente → 404 VEHICLE_NOT_FOUND / DRIVER_NOT_FOUND. Danos próprios\
        \ sem valor comercial → 400 VEHICLE_VALUE_REQUIRED. Mais de 30 pedidos numa\
        \ hora → 429 QUOTE_RATE_LIMITED (Retry-After). Sem produtos compatíveis →\
        \ quotes: []."
      operationId: createQuoteRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Pede cotações para um veículo do cliente
      tags:
      - Rating
  /api/v1/quotes/{id}:
    get:
      description: Permissão self:quotes ou quote:create-for-client. O cliente vê
        os seus (também os do mediador em nome dele); o mediador os da sua organização.
        Outro → 404 QUOTE_REQUEST_NOT_FOUND. status é o estado efectivo (EXPIRED depois
        da validade ou da data de início).
      operationId: getQuoteRequest
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Consulta um pedido de cotações
      tags:
      - Rating
  /api/v1/reference-domains/{domain}/values:
    get:
      description: "Público. Lista completa, não paginada, por sortOrder e labelPt.\
        \ Em VEHICLE_MODEL exclui os modelos de marcas inactivas; parentCode filtra\
        \ pela marca. Domínio desconhecido → 404 REFERENCE_DOMAIN_UNKNOWN."
      operationId: listReferenceValues
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
          enum:
          - VEHICLE_MAKE
          - VEHICLE_MODEL
          - LICENCE_CATEGORY
      - description: Só os valores com este pai (código da marca)
        example: TOYOTA
        in: query
        name: parentCode
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReferenceValuesResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Lista os valores activos de um domínio
      tags:
      - Catalog
  /api/v1/roles:
    get:
      description: "Permissão org-user:read. Indicar organizationId ou scope=PLATFORM\
        \ (um dos dois), com as regras de âmbito dos convites. Devolve também os perfis\
        \ de gestor e os do primeiro gestor."
      operationId: listAssignableRoles
      parameters:
      - description: Organização (ou scope=PLATFORM)
        in: query
        name: organizationId
        required: false
        schema:
          type: string
          format: uuid
      - description: PLATFORM (ou organizationId)
        in: query
        name: scope
        required: false
        schema:
          type: string
          enum:
          - PLATFORM
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignableRolesResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Perfis atribuíveis
      tags:
      - Identity
  /api/v1/users/{id}:
    get:
      description: Permissão org-user:read. Fora do âmbito → 404 USER_NOT_FOUND.
      operationId: getStaffUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Consulta um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/disable:
    post:
      description: Permissão org-user:manage. ACTIVE ou LOCKED → DISABLED e revoga
        as sessões. O próprio → 400 CANNOT_MODIFY_SELF; último gestor activo → 400
        LAST_MANAGER; outro estado → 409 INVALID_STATE_TRANSITION.
      operationId: disableUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Desactiva um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/enable:
    post:
      description: Permissão org-user:manage. DISABLED → ACTIVE; outro estado → 409
        INVALID_STATE_TRANSITION.
      operationId: enableUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Reactiva um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/reset-access:
    post:
      description: "Permissão org-user:manage. Para quem perdeu o telemóvel do TOTP\
        \ ou não consegue entrar: a conta volta a PENDING_ACTIVATION sem palavra-passe\
        \ nem TOTP, as sessões são revogadas e é enviado um convite novo com os perfis\
        \ actuais. Só ACTIVE ou LOCKED (senão 409 INVALID_STATE_TRANSITION); o pró\
        prio → 400 CANNOT_MODIFY_SELF."
      operationId: resetUserAccess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Repõe o acesso de um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/roles:
    put:
      description: Permissão org-user:manage. Vale no login ou na renovação seguinte
        do token. O próprio → 400 CANNOT_MODIFY_SELF; perfil não permitido → 400 ROLE_NOT_ALLOWED_FOR_ORGANIZATION;
        retirar o último gestor activo → 400 LAST_MANAGER; conta por activar → 409
        INVALID_STATE_TRANSITION.
      operationId: updateUserRoles
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRolesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera os perfis de um utilizador de staff
      tags:
      - Identity
  /api/v1/users/{id}/unlock:
    post:
      description: Permissão org-user:manage. LOCKED → ACTIVE; outro estado → 409
        INVALID_STATE_TRANSITION.
      operationId: unlockUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Desbloqueia um utilizador de staff
      tags:
      - Identity
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: "12 a 128 caracteres, sem a parte local do e-mail e fora das\
            \ mais comuns (400 PASSWORD_TOO_WEAK com os motivos em errors[])"
      required:
      - password
    AcknowledgeSuitabilityRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: Versão lida; diferente da gravada → 409 CONCURRENT_MODIFICATION
      required:
      - version
    ActivateInvitationRequest:
      type: object
      properties:
        totpCode:
          type: string
          example: "123456"
      required:
      - totpCode
    ApproveInspectionRequest:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/InspectionMode"
        notes:
          type: string
          example: Vistoria feita na Matola em 08/01.
          maxLength: 1000
        version:
          type: integer
          format: int64
          description: Versão da vistoria; diferente da gravada → 409 CONCURRENT_MODIFICATION
      required:
      - version
    AssignableRolesResponse:
      type: object
      properties:
        managerInviteRoles:
          type: array
          description: Perfis a dar ao primeiro gestor no ecrã de criação de organização
          items:
            type: string
            description: Perfis a dar ao primeiro gestor no ecrã de criação de organização
        managerRoles:
          type: array
          description: "Perfis que fazem de alguém gestor (INSURER_ADMIN, ORG_ADMIN\
            \ ou PLATFORM_ADMIN)"
          items:
            type: string
            description: "Perfis que fazem de alguém gestor (INSURER_ADMIN, ORG_ADMIN\
              \ ou PLATFORM_ADMIN)"
        roles:
          type: array
          description: Perfis atribuíveis
          items:
            type: string
            description: Perfis atribuíveis
      required:
      - managerInviteRoles
      - managerRoles
      - roles
    BrokerVehicleRequest:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/VehicleCategory"
        commercialValue:
          $ref: "#/components/schemas/Money"
        engineCc:
          type: integer
          format: int32
          description: 1–30 000; em TRAILER tem de faltar
          example: 1600
        grossWeightKg:
          type: integer
          format: int32
          description: 1–100 000; obrigatório em HEAVY e TRAILER
        hasTracker:
          type: boolean
          description: Localizador instalado (defeito false)
        make:
          type: string
          example: Toyota
          maxLength: 60
        model:
          type: string
          example: Corolla
          maxLength: 60
        plate:
          type: string
          description: Opcional; num dos formatos activos (INVALID_PLATE)
          example: ABC-123-MC
        provinceOfCirculation:
          type: string
          enum:
          - MAPUTO_CITY
          - MAPUTO
          - GAZA
          - INHAMBANE
          - SOFALA
          - MANICA
          - TETE
          - ZAMBEZIA
          - NAMPULA
          - CABO_DELGADO
          - NIASSA
        seats:
          type: integer
          format: int32
          description: "TRAILER: 0; MOTORCYCLE: 1–3; outras: 1–100"
          example: 5
        usage:
          $ref: "#/components/schemas/VehicleUsage"
        year:
          type: integer
          format: int32
          description: De 1900 ao próximo ano
          example: 2024
      required:
      - category
      - provinceOfCirculation
      - seats
      - usage
      - year
    CatalogInsurerResponse:
      type: object
      properties:
        displayName:
          type: string
          example: Seguradora Demo
