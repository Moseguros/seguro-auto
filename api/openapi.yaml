  /api/v1/insurer/product-versions/{id}:
    get:
      description: Permissão product:read. Inclui as coberturas e os documentos.
      operationId: getProductVersion
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVersionResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Consulta uma versão de um produto
      tags:
      - Catalog
    put:
      description: Permissão product:manage. Versão que não está DRAFT → 409 PRODUCT_VERSION_NOT_EDITABLE;
        produto retirado → 409 PRODUCT_RETIRED; version diferente → 409 CONCURRENT_MODIFICATION.
      operationId: updateProductVersion
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductVersionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVersionResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Altera a elegibilidade de uma versão
      tags:
      - Catalog
  /api/v1/insurer/product-versions/{id}/coverages:
    put:
      description: "Permissão product:manage. Até 12 coberturas; a ordem da lista\
        \ é a ordem de apresentação. Erros de validação → 400 VALIDATION_ERROR com\
        \ errors[].field = coverages[i].<campo>. 409 como em updateProductVersion."
      operationId: replaceProductVersionCoverages
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceCoveragesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVersionResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Substitui as coberturas de uma versão
      tags:
      - Catalog
  /api/v1/insurer/product-versions/{id}/documents:
    post:
      description: "Permissão product:manage. Só PDF (senão 415 FILE_TYPE_NOT_ALLOWED),\
        \ até 10 MB. GENERAL_CONDITIONS e PRE_CONTRACT_INFO substituem o ficheiro\
        \ do documento com o mesmo tipo e língua. Mais de 10 documentos → 409 PRODUCT_DOCUMENT_LIMIT_REACHED.\
        \ 409 como em updateProductVersion."
      operationId: uploadProductVersionDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                docType:
                  type: string
                  enum:
                  - GENERAL_CONDITIONS
                  - PRE_CONTRACT_INFO
                  - SPECIAL_CONDITIONS
                  - OTHER
                file:
                  type: string
                  format: binary
                language:
                  type: string
                  default: pt
                  enum:
                  - pt
                  - en
                title:
                  type: string
                  maxLength: 120
              required:
              - docType
              - file
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDocumentResponse"
          description: Created
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Envia um documento de uma versão
      tags:
      - Catalog
  /api/v1/insurer/product-versions/{id}/documents/{documentId}:
    delete:
      description: Permissão product:manage. O ficheiro fica guardado. Documento desconhecido
        → 404 PRODUCT_DOCUMENT_NOT_FOUND; 409 como em updateProductVersion.
      operationId: deleteProductVersionDocument
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: documentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Retira um documento de uma versão
      tags:
      - Catalog
  /api/v1/insurer/product-versions/{id}/publish:
    post:
      description: "Permissão product:manage. Entra em vigor hoje (Africa/Maputo);\
        \ a versão em vigor passa a SUPERSEDED. Regras por cumprir → 400 PRODUCT_VERSION_NOT_PUBLISHABLE\
        \ com todas as falhas em errors[]; 409 como em updateProductVersion."
      operationId: publishProductVersion
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishProductVersionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVersionResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Publica uma versão
      tags:
      - Catalog
  /api/v1/insurer/product-versions/{id}/rating:
    get:
      description: Permissão rating:manage ou product:read. rating é null quando a
        versão ainda não tem tarifa; coverages são as coberturas da versão; editable
        = versão DRAFT.
      operationId: getRatingRules
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingRulesResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Consulta a tarifa de uma versão de produto
      tags:
      - Rating
    put:
      description: "Permissão rating:manage. Só versões DRAFT (senão 409 PRODUCT_VERSION_NOT_EDITABLE);\
        \ version diferente → 409 CONCURRENT_MODIFICATION. Validada por rating-v1.json\
        \ e pelas regras do S3-01 §7: 400 VALIDATION_ERROR com errors[].field = ponteiro\
        \ JSON dentro de rating. Mais de 256 KB → 400 RATING_RULES_TOO_LARGE."
      operationId: updateRatingRules
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRatingRulesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingRulesResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Grava a tarifa de uma versão em preparação
      tags:
      - Rating
  /api/v1/insurer/product-versions/{id}/rating/simulate:
    post:
      description: "Permissão rating:manage. Versões em qualquer estado da própria\
        \ seguradora (outra → 404 PRODUCT_VERSION_NOT_FOUND). Usa sempre a tarifa\
        \ interna: a gravada ou rating (validada como em updateRatingRules), com os\
        \ encargos gravados ou charges. Devolve a decomposição completa. Não grava\
        \ nada nem chama seguradoras externas."
      operationId: simulateRating
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRatingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingSimulationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Simula a tarifa de uma versão de produto
      tags:
      - Rating
  /api/v1/insurer/product-versions/{id}/rating/validate:
    post:
      description: "Permissão rating:manage. As mesmas validações de updateRatingRules,\
        \ em qualquer estado da versão; todos os erros em errors[] (field = ponteiro\
        \ JSON dentro de rating). Não grava."
      operationId: validateRatingRules
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRatingRulesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingRulesValidationResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Valida uma tarifa sem a gravar
      tags:
      - Rating
  /api/v1/insurer/product-versions/{id}/underwriting-rules:
    get:
      description: "Permissão product:read. Sem regras próprias devolve os valores\
        \ por defeito (isDefault = true): aceitação automática ligada, KYC simplificado\
        \ abaixo de 10 000 MT e danos próprios até 1 500 000 MT com todas as declaraç\
        ões \"não\" (provisórios)."
      operationId: getUnderwritingRules
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnderwritingRulesResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Server error (RFC 7807)
      summary: Consulta as regras de aceitação de uma versão
      tags:
      - Catalog
    put:
      description: "Permissão product:manage. Só em DRAFT (senão 409 PRODUCT_VERSION_NOT_EDITABLE);\
        \ version diferente → 409 CONCURRENT_MODIFICATION. As regras seguem o schema\
        \ underwriting-v1 (campos desconhecidos recusados): erros → 400 VALIDATION_ERROR\
        \ com errors[] = { field: rules.<caminho>, code: INVALID_RULES }."
