                $ref: "#/components/schemas/PaymentMethodResponse"
          description: OK
        "4XX":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Client error (RFC 7807)
        "5XX":
          content:
            application/problem+json:
